name: APK bauen

on:
  push:
    branches: [main, 'build-*']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sprachmodell für die Offline-Erkennung laden
        run: |
          curl -sfL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model-de
          mv vosk-model-small-de-0.15 app/src/main/assets/model-de
          echo "small-de-0.15" > app/src/main/assets/model-de/uuid
          du -sh app/src/main/assets/model-de

      - name: APK kompilieren
        env:
          SK_KEY_PASSWORD: ${{ secrets.SK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Sozialkunde.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sozialkunde-APK
          path: Sozialkunde.apk

      - name: Als Release veröffentlichen (direkter Download-Link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          gh release create "v${VERSION}-${{ github.run_number }}" Sozialkunde.apk \
            --title "Sozialkunde ${VERSION}" \
            --notes "**Installieren:** Sozialkunde.apk auf dem Android-Handy herunterladen, antippen und „Installieren“ wählen (einmalig „Unbekannte Apps installieren“ erlauben). Android 10 oder neuer." \
            --latest
