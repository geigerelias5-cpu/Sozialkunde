<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Sozialkunde Trainer</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* VOICE: ruhig, technisch, knapp – wie ein Nothing-Systemscreen
   IDEA: Punktmatrix-Display; Fortschritt als Zahl in Punktschrift und als Punktreihe
   PICTURE: große Doto-Zahl „sicher / 280“ mit Punktleiste, darunter Blöcke als Liste
   COLOUR and TYPE: Schwarz/Weiß, Grautöne, ein rotes Signal #d71921; Doto für Zahlen, Hanken Grotesk für Text
   LAYOUT: eine Spalte, Handy zuerst, nur große Listenzeilen und Pill-Buttons */
:root{color-scheme:light dark;--bg:light-dark(#f4f4f2,#050505);--ink:light-dark(#111,#f2f2f2);--mut:light-dark(#6b6b6b,#9a9a9a);--card:light-dark(#fff,#151515);--card2:light-dark(#ececea,#1e1e1e);--line:light-dark(#dcdcd8,#2a2a2a);--red:#d71921;--green:light-dark(#12923f,#2fc463)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip}
.dot{font-family:Doto,"Hanken Grotesk",monospace;font-weight:900;letter-spacing:.02em}
button{font:inherit;color:inherit;transition:transform .15s}button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom))}
.cap{font-size:13px;color:var(--mut);margin:0}
h1{font-size:30px;line-height:1.05;margin:2px 0 0;font-weight:700}
.hero{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px 20px 18px;margin:16px 0 12px}
.big{font-size:clamp(56px,19vw,84px);line-height:1}.big span{color:var(--mut);font-size:.45em}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.k{background:var(--ink)}.dots i.w{background:var(--red)}.dots i.s{background:var(--mut)}
.row3{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px}
.row3 b{color:var(--ink);font-family:Doto,monospace;font-weight:900;font-size:18px;margin-right:4px}.row3 .r b{color:var(--red)}
.pri{width:100%;min-height:58px;border:0;border-radius:99px;background:var(--red);color:#fff;font-weight:700;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.sec.wide{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.sec{min-height:56px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:500;font-size:15px;cursor:pointer;padding:0 12px}
.sec:disabled{opacity:.4;cursor:default}
h3{font-size:14px;color:var(--mut);font-weight:500;margin:22px 4px 8px}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.blk{width:100%;border:0;background:none;text-align:left;padding:14px 18px;min-height:68px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.blk .n{font-family:Doto,monospace;font-weight:900;font-size:22px;width:2ch;text-align:right}
.blk b{display:block;font-weight:500}.blk small{color:var(--mut);font-size:13px}
.tr{display:block;height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;display:flex}
.tr i{height:100%}.tr .k{background:var(--ink)}.tr .s{background:var(--mut)}.tr .w{background:var(--red)}
.chev{color:var(--mut);transition:transform .3s}.open .chev{transform:rotate(90deg)}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.9,.2,1)}.open .sub{grid-template-rows:1fr}
.sub>div{overflow:hidden}
.sub .go{margin:0 14px 10px;width:calc(100% - 28px);min-height:50px;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.qi{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 18px;min-height:56px;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:center;font-size:15px}
.qi i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mut)}.qi i.k{background:var(--ink);border-color:var(--ink)}.qi i.s{background:var(--mut);border-color:var(--mut)}.qi i.w{background:var(--red);border-color:var(--red)}
.qi span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.foot2{font-size:13px;color:var(--mut);margin:18px 4px 0}
.lnk{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:14px;padding:12px 4px;min-height:44px;cursor:pointer}
/* Quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ib{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;flex:none}
.cnt{font-family:Doto,monospace;font-weight:900;font-size:20px}
.pbar{display:flex;gap:3px;margin:14px 0 18px}.pbar i{flex:1;height:4px;border-radius:99px;background:var(--line)}.pbar i.d{background:var(--ink)}.pbar i.c{background:var(--red)}
.qn{font-size:13px;color:var(--mut)}
.q{font-size:clamp(21px,5.6vw,25px);line-height:1.25;font-weight:700;margin:4px 0 18px;text-wrap:pretty}
.ans{display:grid;gap:8px}
.a{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;min-height:60px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;font-size:16px;line-height:1.35}
.a .k{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-family:Doto,monospace;font-weight:900;font-size:15px}
.a.ok{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}.a.ok .k{background:#fff;color:var(--green)}
.a.bad{border-color:var(--red);background:var(--red);color:#fff}.a.bad .k{background:#fff;color:var(--red)}
.a.dim{opacity:.4}
.note{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-size:15px}
.note b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--red);margin-bottom:4px}.note b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.bot .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bot .pri{flex:1}.bot .sec{flex:0 0 auto;padding:0 22px}
.res{text-align:center;margin:30px 0 10px}.res .big{font-size:clamp(90px,32vw,150px)}.res p{color:var(--mut);margin:6px 0}
.ri{list-style:none;padding:14px 18px}.ri .qn{margin-bottom:2px}.ri .aa{font-weight:700;margin-top:4px}.ri .nn{color:var(--mut);font-size:13px;margin-top:4px}
.search{width:100%;font-size:16px;padding:0 20px;min-height:54px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0 10px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:6px}
.dlg .in{display:flex;gap:8px;margin-top:12px}.dlg .in button{flex:1}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gear{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;flex:none;margin-top:2px}
.ov{position:fixed;inset:0;z-index:50;pointer-events:none}
.ov .dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s}
.ov .pan{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.2,1)}
.ov.on{pointer-events:auto}.ov.on .dim{opacity:.55}.ov.on .pan{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.pan h2{font-size:22px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:14px 2px;min-height:64px;text-align:left;cursor:pointer}
.set small{display:block;color:var(--mut);font-size:13px}
.sw{flex:none;width:56px;height:34px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0004;transition:transform .25s cubic-bezier(.2,.9,.2,1)}
.set[aria-checked=true] .sw{background:var(--red)}.set[aria-checked=true] .sw::after{transform:translateX(22px)}
.set.warn{color:var(--red);font-weight:700}
.conf{border:1px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:22px;padding:16px;margin-top:6px}
.conf b{display:block;font-size:17px;margin-bottom:4px}.conf p{margin:0;color:var(--mut);font-size:14px}
.conf .in{display:flex;gap:8px;margin-top:14px}.conf .in button{flex:1}
.conf .del{min-height:52px;border:0;border-radius:99px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
.conf .no{min-height:52px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:500;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#000;color:#f2f2f2;border:1px solid #ffffff1f;border-radius:99px;padding:12px 20px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note p{margin:0}.note .rt{font-weight:700;margin-bottom:6px}
.note.ex b{color:var(--ink)}.note.ex b::before{background:var(--ink)}.note.ok b::before{background:var(--ink)}
.ri .ee{color:var(--mut);font-size:14px;margin-top:6px}
.tr2{display:flex;align-items:center;gap:8px}
.ib.mic.on{background:var(--red);border-color:var(--red);color:#fff}
.vst{display:flex;align-items:center;gap:10px;min-height:22px;margin:-6px 0 12px;font-size:14px;color:var(--mut)}
.vst:empty{display:none}
.vst i{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.vst.listen{color:var(--red);font-weight:700}.vst.listen i{background:var(--red);animation:pulse 1s ease-in-out infinite}
.vst.speak i{background:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.45}}
.a.rd{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.seg{display:flex;gap:4px;background:var(--card2);border-radius:99px;padding:4px;flex:none}
.seg button{border:0;background:none;border-radius:99px;min-height:40px;padding:0 12px;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px #0002}
.setx{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 2px;min-height:64px;flex-wrap:wrap}
.setx small{display:block;color:var(--mut);font-size:13px}
.vhint{font-size:13px;color:var(--mut);margin:-4px 2px 8px}
.a.pick{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.a.pick .k{background:var(--ink);color:var(--bg)}
.swh{text-align:center;color:var(--mut);font-size:13px;margin:16px 0 0}
#app{touch-action:pan-y}
.ov .pan{max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
.sech{font-size:13px;color:var(--mut);margin:16px 2px 6px;font-weight:500}
.btn2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.btn3{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn3 .sbtn{flex:1 1 140px}
.sbtn{min-height:52px;border:1px solid var(--line);border-radius:99px;background:var(--card2);font-weight:500;font-size:15px;cursor:pointer;padding:0 14px}
.sbtn.pri2{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.box{border:1px solid var(--line);border-radius:22px;padding:16px}.box b{display:block;font-size:17px}.box p{margin:4px 0 0;color:var(--mut);font-size:14px}
.code{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px 12px;resize:vertical;word-break:break-all}
.lnk2{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:14px;min-height:44px;padding:0 4px;margin-top:4px;cursor:pointer}
/* Ergebnis-Streifen hinter der ganzen Seite: grün = richtig, rot = falsch */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s}
body.mood-ok::before{opacity:1;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--green) 22%,transparent) 0 18px,transparent 18px 36px)}
body.mood-bad::before{opacity:1;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--red) 22%,transparent) 0 18px,transparent 18px 36px)}
body{position:relative;isolation:isolate}
.note.ok{border-color:var(--green);border-width:2px}.note.ok b{color:var(--green);font-size:15px}.note.ok b::before{background:var(--green)}
.note.bad{border-color:var(--red);border-width:2px}.note.bad b{font-size:15px}
.verdict{display:flex;align-items:center;gap:10px;border-radius:22px;padding:12px 16px;margin-top:14px;color:#fff;font-weight:700;font-size:18px}
.verdict.ok{background:var(--green)}.verdict.bad{background:var(--red)}
.verdict svg{flex:none}
body.mood-ok .bot .pri{background:var(--green)}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.verdict{animation:pop .35s cubic-bezier(.2,.9,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.enter>*{animation:up .45s cubic-bezier(.2,.9,.2,1) both}.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(n+4){animation-delay:.12s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov" aria-hidden="true"><div class="dim" id="ovdim"></div><div class="pan" role="dialog" aria-label="Einstellungen" id="pan"></div></div>
<div class="toast" id="toast"></div>
<div class="bot" id="bot" hidden><div class="in" id="botin"></div></div>
<script>
const DATA=[{"q":"Wer ist von drohender Arbeitslosigkeit am meisten betroffen?","a":["Selbständige","Personen ohne Berufsausbildung","Facharbeiter","Akademiker","Umschüler"],"c":1,"n":"","e":"Wer keine Berufsausbildung hat, kann meist nur einfache Tätigkeiten ausüben. Genau diese Stellen fallen bei Rationalisierung und Automatisierung zuerst weg."},{"q":"Eine ledige Arbeitnehmerin ohne Kinder wird eingestellt in Lohnsteuerklasse","a":["I","II","III","IV","V"],"c":0,"n":"","e":"Steuerklasse I gilt für Ledige, Geschiedene und dauernd getrennt Lebende ohne Kinder. Alleinerziehende bekommen Klasse II, Verheiratete III, IV oder V."},{"q":"Welches Wirtschaftsprinzip wird in der Bundesrepublik Deutschland angewandt?","a":["freie Marktwirtschaft","soziale Marktwirtschaft","freie wirtschaft","planwirtschaft","Verwaltungswirtschaft"],"c":1,"n":"","e":"Die soziale Marktwirtschaft verbindet freien Wettbewerb mit sozialem Ausgleich durch den Staat. Sie wurde nach 1948 von Ludwig Erhard eingeführt."},{"q":"Was ist eine Aktie?","a":["Anteil am ausgeschütteten Gewinn eines Unternehmens","Anteil am Kapitalvermögen einer AG","Pfandbrief","Schuldverschreibung","Aktie ist ein anderes Wort für Dividende"],"c":1,"n":"","e":"Mit einer Aktie besitzt man einen Anteil am Grundkapital einer Aktiengesellschaft und ist damit Miteigentümer. Der Gewinnanteil daraus heißt Dividende."},{"q":"Was wird durch die Tarifautonomie geregelt?","a":["Unfallschutz am Arbeitsplatz","Zuständigkeit bei Gesellen- und Meisterprüfungen","Arbeitszeit, Lohn und Urlaub von Arbeitnehmern","Verpflichtung der selbständigen Meister, Auszubildende korrekt zu unterweisen","Regelungen zum Jugendarbeitsschutzgesetz"],"c":2,"n":"","e":"Tarifautonomie heißt: Gewerkschaften und Arbeitgeberverbände handeln Löhne und Arbeitsbedingungen wie Arbeitszeit und Urlaub selbst aus, ohne dass der Staat eingreift."},{"q":"Wer zwingt den privaten Betrieb wirtschaftlich zu handeln?","a":["Die Innung","Die Konkurrenz","Das Wirtschaftsministerium","Das Finanzamt","Der Bundeskanzler"],"c":1,"n":"","e":"Im Wettbewerb überlebt nur, wer kostengünstig und gut anbietet. Die Konkurrenz zwingt den Betrieb deshalb, wirtschaftlich zu arbeiten."},{"q":"Was versteht man unter „Konjunktur“?","a":["Die Entwicklung der Arbeitslosenzahl","Die Entwicklung der Preise","Die jeweilige wirtschaftliche Lage bzw. Gesamtentwicklung","Stetiges Wirtschaftswachstum","Das Bruttoinlandsprodukt"],"c":2,"n":"","e":"Konjunktur beschreibt die gesamtwirtschaftliche Lage und ihre Schwankungen. Sie verläuft in Phasen: Aufschwung, Hochkonjunktur (Boom), Abschwung und Tiefstand."},{"q":"Mit welchem Fachbegriff wird das Produktionsergebnis eines Landes in einem Jahr bezeichnet?","a":["Subventionen","Investitionen","Sozialprodukt","Konjunktur","Inflation"],"c":2,"n":"","e":"Das Sozialprodukt misst den Wert aller in einem Jahr hergestellten Waren und Dienstleistungen einer Volkswirtschaft. Heute verwendet man meist das Bruttoinlandsprodukt (BIP)."},{"q":"Welche konjunkturpolitische Maßnahme ist im Konjunkturabschwung sinnvoll?","a":["Erhöhung der Steuern","Senkung der Zinsen","Haushaltskürzungen bzw. Streichungen von geplanten Investitionen","Aufwertung des Euro","Kürzung der Transferleistungen"],"c":1,"n":"","e":"Sinkende Zinsen machen Kredite billiger. Unternehmen investieren und Verbraucher kaufen mehr, dadurch wird die Wirtschaft belebt."},{"q":"Kreuzen Sie ein Hauptziel staatlicher Wirtschaftspolitik an!","a":["Arbeitslosigkeit","Mangel an Verbrauchsgütern","Schleichende Inflation","Stetes Wirtschaftswachstum","30-Stunden-Woche"],"c":3,"n":"","e":"Das Stabilitätsgesetz von 1967 nennt vier Hauptziele, das „Magische Viereck“: stetiges und angemessenes Wachstum, stabile Preise, hoher Beschäftigungsstand und außenwirtschaftliches Gleichgewicht."},{"q":"Welche der genannten Steuern wird vom Arbeitslohn abgezogen?","a":["Einkommenssteuer","Gewerbesteuer","Grundsteuer","Kirchensteuer","Haftpflichtversicherung"],"c":3,"n":"","e":"Vom Lohn zieht der Arbeitgeber Lohnsteuer, Solidaritätszuschlag (nur noch bei hohen Einkommen) und bei Kirchenmitgliedern die Kirchensteuer ab. Gewerbe- und Grundsteuer zahlen Betriebe bzw. Grundeigentümer."},{"q":"Welches Ziel strebt man mit der Rationalisierung in erster Linie an?","a":["Geringere Produktion","Kostensenkung","Längere Arbeitszeit","Geringeren Lebensstandard","Senkung der Inflation"],"c":1,"n":"","e":"Rationalisierung heißt, mit besseren Maschinen und Abläufen dasselbe mit weniger Aufwand herzustellen. Ziel ist es, die Kosten zu senken."},{"q":"Ein Arbeitnehmer hat einen Arbeitsunfall erlitten. Welche Stelle muss benachrichtigt werden?","a":["Industrie- und Handelskammer","Berufsgenossenschaft","Arbeitsamt","AOK (Allgemeine Ortskrankenkasse)","Handwerkskammer"],"c":1,"n":"","e":"Die Berufsgenossenschaft ist Träger der gesetzlichen Unfallversicherung. Ein Arbeitsunfall mit mehr als drei Tagen Arbeitsunfähigkeit muss ihr vom Arbeitgeber gemeldet werden."},{"q":"Worauf ist in der Marktwirtschaft die unternehmerische Betätigung gerichtet?","a":["Auf Erfüllung staatlich festgelegter Planziele","Auf Gewinn","Auf Spekulationen","Auf Umsatz zu Selbstkosten","Senkung der Arbeitslosigkeit"],"c":1,"n":"","e":"In der Marktwirtschaft tragen Unternehmer das Risiko selbst. Ihr Antrieb ist der Gewinn, nicht staatliche Vorgaben."},{"q":"Ein Arbeitnehmer meint, er sei zu Unrecht fristlos entlassen worden. Welches Gericht ist zuständig?","a":["Arbeitsgericht","Verwaltungsgericht","Zivilkammer des Landgerichts","Sozialgericht","Finanzgericht"],"c":0,"n":"","e":"Für alle Streitigkeiten aus dem Arbeitsverhältnis, zum Beispiel eine Kündigung, ist das Arbeitsgericht zuständig. Eine Kündigungsschutzklage muss innerhalb von 3 Wochen eingereicht werden."},{"q":"Bei einem Arbeitsplatzwechsel muss dem neuen Arbeitgeber der Sozialversicherungsausweis vorgelegt werden. Welches Dokument ist außerdem noch auszuhändigen?","a":["Lohnsteuerkarte","Geburtsurkunde","Letztes Zeugnis der Grundschule","Reisepass","Personalausweis"],"c":0,"n":"Die Lohnsteuerkarte wurde 2013 durch das elektronische Verfahren ELStAM ersetzt. Heute gibt man dem Arbeitgeber Steuer-ID und Geburtsdatum.","e":"Früher gab man dem neuen Arbeitgeber die Lohnsteuerkarte, damit er die Lohnsteuer richtig berechnen konnte. Heute läuft das elektronisch über die Steuer-ID (ELStAM)."},{"q":"Von einem Unternehmen wird gesagt, es habe eine Monopolstellung inne. Was meint man damit?","a":["Es arbeitet überwiegend mit Fremdkapital","Es handelt sich um ein Unternehmen mit Staatsbeteiligung","Es handelt sich um eine Filiale eines ausländischen Unternehmens","Es handelt sich um ein marktbeherrschendes Unternehmen","Eine Firma, die sich auf die Herstellung von Monopolyspielen spezialisiert hat"],"c":3,"n":"","e":"Ein Monopol hat ein Unternehmen, das als einziger Anbieter den Markt beherrscht. Ohne Konkurrenz kann es Preise weitgehend selbst bestimmen."},{"q":"In welchem Fall wird gegen den sozialen Arbeitsschutz verstoßen?","a":["Eine Schwangere muss bis 4 Wochen vor der Niederkunft arbeiten","Ein 20-jähriger muss im Akkord arbeiten","Ein Arbeitnehmer muss Schichtarbeit leisten","Ein Bauarbeiter muss einen Schutzhelm tragen","Ein Jugendlicher muss in der Woche 40 Stunden arbeiten"],"c":0,"n":"","e":"Nach dem Mutterschutzgesetz dürfen werdende Mütter 6 Wochen vor der Geburt nur arbeiten, wenn sie es ausdrücklich selbst wollen. Eine Pflicht bis 4 Wochen vorher verstößt dagegen."},{"q":"Welches Gericht ist zuständig für Streitigkeiten zwischen Versicherten und Pflichtkrankenkasse?","a":["Verwaltungsgericht","Arbeitsgericht","Finanzgericht","Sozialgericht","Amtsgericht"],"c":3,"n":"","e":"Streit mit Sozialversicherungsträgern (Kranken-, Renten-, Unfall-, Pflege-, Arbeitslosenversicherung) entscheidet das Sozialgericht."},{"q":"Wonach wird in der Marktwirtschaft der Preis einer Ware bestimmt?","a":["Durch Festsetzung der Preise seitens der Regierung","Durch Angebot und Nachfrage","Durch Festlegens der Preise seitens der Hersteller","Durch die jeweilige Währung","Der Preis wird vom Kartellamt festgelegt"],"c":1,"n":"","e":"In der Marktwirtschaft bildet sich der Preis durch Angebot und Nachfrage. Steigt die Nachfrage, steigt der Preis, steigt das Angebot, sinkt er."},{"q":"Welche Versicherung nimmt man in Anspruch, wenn man auf Dauer arbeitsunfähig ist?","a":["Rentenversicherung","Krankenversicherung","Arbeitslosenversicherung","Haftpflichtversicherung","Pflegeversicherung"],"c":0,"n":"","e":"Wer dauerhaft nicht mehr arbeiten kann, bekommt eine Erwerbsminderungsrente von der Rentenversicherung. Die Krankenkasse zahlt nur vorübergehend Krankengeld."},{"q":"Wer ist für die Herausgabe der Unfallverhütungsvorschriften zuständig?","a":["Das Wirtschaftsministerium","Die zuständige Berufsgenossenschaft","Das Gewerbeaufsichtsamt","Die Innung","Die Handwerkskammer"],"c":1,"n":"","e":"Die Berufsgenossenschaften erlassen die Unfallverhütungsvorschriften für ihre Branchen und überwachen auch deren Einhaltung."},{"q":"Wie heißt die erste Instanz der ordentlichen Gerichtsbarkeit?","a":["Oberlandesgericht","Landgericht","Verwaltungsgericht","Amtsgericht","Arbeitsgericht"],"c":3,"n":"","e":"Die ordentliche Gerichtsbarkeit (Zivil- und Strafsachen) hat den Aufbau Amtsgericht → Landgericht → Oberlandesgericht → Bundesgerichtshof. Das Amtsgericht ist die unterste Stufe."},{"q":"In welcher Gemeinschaft ist die Bundesrepublik Mitglied?","a":["EU","PLO","Völkerbund","OPEC","ADAC"],"c":0,"n":"","e":"Deutschland ist Gründungsmitglied der Europäischen Gemeinschaft (1957), aus der die EU hervorging. Die anderen Antworten sind Organisationen, in denen Deutschland nicht Mitglied ist, oder ein Automobilclub."},{"q":"Wann muss ein Ausbildungsvertrag verlängert werden?","a":["Auf Verlangen des Auszubildenden bei nichtbestandener Prüfung","Auf Verlangen des Ausbilders bei nichtbestandener Prüfung","Automatisch bei Nichtbestehen der Abschlussprüfung","Auf Verlangen der Handwerkskammer bei nichtbestandener Prüfung","Auf Bestreben der Berufsschule"],"c":0,"n":"","e":"Besteht ein Azubi die Abschlussprüfung nicht, verlängert sich die Ausbildung auf sein Verlangen bis zur nächsten Wiederholungsprüfung, höchstens um ein Jahr (§ 21 BBiG)."},{"q":"An welcher Sozialversicherung sollen sich die Bürger, nach dem ehemaligen Minister Riester, selbst aktiv beteiligen?","a":["Krankenversicherung","Arbeitslosenversicherung","Pflegeversicherung","Unfallversicherung","Rentenversicherung"],"c":4,"n":"","e":"Mit der Riester-Rente (2002, benannt nach Arbeitsminister Walter Riester) soll man privat zusätzlich für das Alter vorsorgen, weil die gesetzliche Rente allein nicht reicht. Der Staat gibt Zulagen dazu."},{"q":"Seit einigen Jahren gibt es in Europa ein Wirtschafts- und Währungsunion. Wer ist seitdem für die Geldpolitik verantwortlich?","a":["Die Zentralstelle der Sparkassen","Jedes Land hat seine eigene nationale Bank, die dafür zuständig ist","Die Europäische Zentralbank in Frankfurt","Die neue Bank, die durch den Zusammenschluss von Deutscher Bank und Dresdner Bank entstanden ist","Der Wirtschaftsminister der einzelnen Nationen"],"c":2,"n":"","e":"Seit dem Euro (1999) bestimmt die Europäische Zentralbank (EZB) in Frankfurt am Main die Geldpolitik der Euro-Länder, zum Beispiel die Leitzinsen."},{"q":"Rezession in der Volkswirtschaft bedeutet:","a":["Ausdehnung der Produktion","Steigerung des Geldumlaufs","Wirtschaftsabschwung","Höchststand im Konjunkturverlauf","Tiefstand im Wirtschaftsverlauf"],"c":2,"n":"","e":"Rezession ist ein Wirtschaftsabschwung: Produktion und Nachfrage gehen zurück, oft steigt die Arbeitslosigkeit."},{"q":"Welche Versicherung zahlt der Arbeitgeber zu 100%?","a":["Arbeitslosenversicherung","Rentenversicherung","Unfallversicherung","Pflegeversicherung","Krankenversicherung"],"c":2,"n":"","e":"Die Beiträge zur gesetzlichen Unfallversicherung (Berufsgenossenschaft) zahlt allein der Arbeitgeber. Die anderen Sozialversicherungen teilen sich Arbeitgeber und Arbeitnehmer."},{"q":"Durch welche wirtschaftspolitischen Ziele wurde das „Magische Viereck“ zum „Magischen Sechseck“ erweitert?","a":["Schutz der Umwelt und gerechte Einkommensverteilung","Recht auf Arbeit und sinnvolle Gestaltung der Freizeit","Gerechte Einkommensverteilung und Einrichtung von Arbeitskonten","Stabile Preise und hoher Beschäftigungsstand","Staatliche Bekämpfung von radikalen Parteien und Religionsanhängern"],"c":0,"n":"","e":"Zu den vier Zielen des Magischen Vierecks kamen später Umweltschutz und eine gerechte Einkommens- und Vermögensverteilung dazu. So entstand das Magische Sechseck."},{"q":"Durch verschiedene Maßnahmen kann die Europäische Zentralbank auf die Konjunktur einwirken. Wenn sie den Zinssatz senkt, bewirkt sie, dass:","a":["die Unternehmen wieder mehr investieren","viele Personen ihr Geld auf die Sparkasse bringen","die Unternehmen weniger investieren","die Inflation gesenkt wird","mehr Firmen in Konkurs gehen"],"c":0,"n":"","e":"Niedrige Zinsen machen Kredite billig, deshalb lohnen sich Investitionen für Unternehmen mehr. Das kurbelt die Wirtschaft an."},{"q":"Ein Unternehmen hat „Insolvenz“ angemeldet. Was versteht man darunter?","a":["Eine freiwillige Auflösung des Unternehmens","Ein gerichtliches Mahnverfahren wegen Zahlungsforderungen","Ein gerichtliches Vergleichsverfahren wegen Besitzerwechsel","Eine zwangsweise Auflösung des Unternehmens wegen Zahlungsunfähigkeit","Eine höhere Inflationsrate"],"c":3,"n":"","e":"Insolvenz bedeutet Zahlungsunfähigkeit oder Überschuldung. Im Insolvenzverfahren wird das Vermögen an die Gläubiger verteilt; das Unternehmen wird aufgelöst oder, wenn möglich, saniert."},{"q":"Was ist das Bruttosozialprodukt?","a":["Die Ausgaben des Staates für soziale Aufwendungen in einem Jahr","Die Summe der im Staat vorhandenen Produktionsgüter","Der Wert, der in einem Jahr hergestellten Güter (Waren und Dienstleistungen) einer Volkswirtschaft","Der Aufwand der Tarifparteien für die Sozialversicherung in einem Jahr","Das Bruttoeinkommen eines Arbeitnehmers"],"c":2,"n":"","e":"Das Bruttosozialprodukt (heute Bruttonationaleinkommen) ist der Wert aller Waren und Dienstleistungen, die in einem Jahr in einer Volkswirtschaft hergestellt werden."},{"q":"Jemand, der viel verdient, zahlt prozentual mehr Steuern als ein Geringverdiener. Wie heißt der steuerliche Fachbegriff?","a":["Progression","Depression","Rezession","Inflation","Deflation"],"c":0,"n":"","e":"Bei der Steuerprogression steigt der Steuersatz mit dem Einkommen. Wer mehr verdient, zahlt also einen höheren Prozentsatz."},{"q":"Wirtschaftswachstum ist ein vorrangiges Ziel der Wirtschaftspolitik. Welche große Gefahr ergibt sich durch ein ungebremstes Wachstum?","a":["Der technische Fortschritt nimmt zu","Neuen Erfindungen werden gemacht","Die Umwelt wird in zunehmenden Maße zerstört","Produktionsfaktoren werden sinnvoll eingesetzt","Der Grad der Arbeitsteilung nimmt zu"],"c":2,"n":"","e":"Mehr Produktion bedeutet mehr Rohstoffverbrauch, Abgase und Müll. Ungebremstes Wachstum belastet deshalb die Umwelt."},{"q":"Der Staat erteilt öffentliche Bauaufträge in Milliardenhöhe zum Bau von Schulen, Kindergärten und Straßen. Was soll mit dieser Maßnahme erreicht werden?","a":["Förderung der Elitebildung","Die Konjunktur wird gebremst","Weniger Staus auf den Straßen","Die Steuereinnahmen des Staates sinken","Die Konjunktur soll angekurbelt werden"],"c":4,"n":"","e":"Öffentliche Aufträge schaffen Arbeit für Baufirmen und Zulieferer. Der Staat will damit die Konjunktur ankurbeln."},{"q":"Das Recht der freien Berufs- und Ausbildungswahl:","a":["wird durch das Arbeitsrecht gewährleistet","ist im Grundgesetz Art. 12 garantiert","ist im Grundgesetz nicht verankert","gilt nur in den alten Bundesländern","gilt nur bis zum 18. Lebensjahr"],"c":1,"n":"","e":"Artikel 12 des Grundgesetzes garantiert allen Deutschen, Beruf, Arbeitsplatz und Ausbildungsstätte frei zu wählen."},{"q":"Bei welcher Aufzählung werden nur Länder genannt, die ständige Mitglieder im UNO-Sicherheitsrat sind?","a":["Deutschland, Japan, USA","Frankreich, China, Australien","Großbritannien, Russland, Kanada","USA, Russland, Deutschland","Frankreich, Großbritannien, China"],"c":4,"n":"","e":"Die fünf ständigen Mitglieder im UN-Sicherheitsrat sind USA, Russland, China, Frankreich und Großbritannien. Sie haben ein Vetorecht."},{"q":"Streitigkeiten zwischen Arbeitnehmer und Arbeitgeber über Regelung im Arbeitsvertrag können vor dem:","a":["Amtsgericht geregelt werden","Bundesverfassungsgericht geregelt werden","Verwaltungsgericht geregelt werden","Finanzgericht geregelt werden","Arbeitsgericht geregelt werden"],"c":4,"n":"","e":"Für Streit zwischen Arbeitnehmer und Arbeitgeber aus dem Arbeitsvertrag ist das Arbeitsgericht zuständig."},{"q":"Um die wirtschaftliche Tätigkeit messen und bewerten zu können, sind folgende drei betriebliche Nenngrößen notwendig:","a":["Gewinn, Verlust und Stammkapital","Gewinn, Umsatz und Krankheitstage der Mitarbeiter","Rentabilität, Gewinn und Eigenkapital","Produktivität, Wirtschaftlichkeit und Rentabilität","Produktivität, Umsatz und Stammkapital"],"c":3,"n":"","e":"Produktivität (Menge im Verhältnis zum Einsatz), Wirtschaftlichkeit (Ertrag im Verhältnis zu Kosten) und Rentabilität (Gewinn im Verhältnis zum Kapital) sind die drei betrieblichen Kennzahlen."},{"q":"Immer mehr Handwerksbetriebe wählen die Unternehmensform der GmbH. Welchen Vorteil hat der Unternehmer bei dieser Form der Kapitalgesellschaft? Der Unternehmer:","a":["haftet nur mit seinem Stammkapital","haftet nur mit seinem privaten Vermögen","haftet mit seinem privaten Vermögen und dem Stammkapital","haftet mit seinem Aktienbesitz","haftet überhaupt nicht"],"c":0,"n":"","e":"Bei der GmbH haftet nur das Gesellschaftsvermögen, also die Einlagen. Das Privatvermögen des Unternehmers ist geschützt."},{"q":"Unter dem sozialpolitischen Fachbegriff „Subsidiaritätsprinzip“ versteht man:","a":["die Unterdrückung sozial schwacher Bürger","die Solidarität aller Beteiligten","die Hilfe zur Selbsthilfe","die Abschaffung der Sozialgesetze","die Anpassung der Rente an die Inflationsrate"],"c":2,"n":"","e":"Subsidiarität heißt: Zuerst hilft man sich selbst, dann die Familie, erst danach die Gemeinschaft oder der Staat. Der Staat gibt Hilfe zur Selbsthilfe."},{"q":"Welche Leistung erbringt die gesetzliche Krankenkasse n i c h t?","a":["Verletztenrente","Krankengeld","Kostenübernahme für Blinddarmoperation","Mutterschaftsgeld","Teilkostenerstattung für Arzneien"],"c":0,"n":"","e":"Eine Verletztenrente zahlt die gesetzliche Unfallversicherung (Berufsgenossenschaft) nach Arbeitsunfällen, nicht die Krankenkasse."},{"q":"Petra Fröhlich und Helmut Lustig heiraten. Welche Namensgebung ist für die gemeinsamen Kinder der Ehepartner möglich?","a":["Mehrere Kinder: Entweder alle Fröhlich oder Lustig","Mehrere Kinder: Fröhlich oder Lustig ist für sie möglich","Fröhlich – Lustig (Doppelname)","Lustig – Fröhlich (Doppelname)","Nur Fröhlich"],"c":0,"n":"","e":"Haben die Eltern keinen gemeinsamen Ehenamen, bekommen alle gemeinsamen Kinder denselben Namen eines Elternteils. Seit Mai 2025 ist für Kinder zusätzlich ein Doppelname aus beiden Namen möglich."},{"q":"Petra Fröhlich und Helmut Lustig vereinbaren vor der Ehe die Zugewinngemeinschaft. Die Ehe bleibt kinderlos. Wer erbst nach dem Tod ihres Ehemanns?","a":["Die Ehefrau erbt alles","Die Ehefrau die Hälfte und die lebenden Geschwister und Eltern des Ehemanns jeweils die Hälfte.","Drei Viertel die Ehefrau und den Rest die lebenden Eltern des Verstorbenen.","Drei Viertel die Ehefrau und den Rest die lebenden Geschwister des Ehemanns. Die lebenden Eltern sind von der Erbfolge ausgeschlossen.","Der Staat erbt alles."],"c":2,"n":"","e":"Ohne Kinder erbt der Ehepartner neben den Eltern des Verstorbenen die Hälfte, bei Zugewinngemeinschaft kommt ein Viertel als Ausgleich dazu. Das ergibt drei Viertel, das restliche Viertel geht an die Eltern."},{"q":"Ein Betriebsinhaber übergibt die Reinigungsarbeiten in der Bäckerei der Reinigungsfirma Blitz und Blank GmbH. Wie nennt sich diese Form der Betriebsorganisation?","a":["Lean Produktion","Just in time","Leiharbeit","Outsourcing","Fremdarbeit"],"c":3,"n":"","e":"Outsourcing heißt, Aufgaben an eine fremde Firma auszulagern, die sie günstiger oder besser erledigt."},{"q":"Die Höhe des Arbeitslosengeldes richtet sich unter anderem nach","a":["Der Anzahl der Beitragsjahre","Dem Lebensalter","Dem zuletzt bezogenem Nettoarbeitsentgelt","Dem Familienstand und der Anzahl der Kinder","Den insgesamt entrichteten Beiträgen"],"c":2,"n":"","e":"Das Arbeitslosengeld beträgt 60 % (mit Kind 67 %) des pauschalierten Nettoentgelts der letzten 12 Monate."},{"q":"Die Familie steht unter dem besonderen Schutz des Staates. Welche Maßnahme gehört nicht dazu?","a":["Kindergeld","Ausbildungsförderung","Erziehungsurlaub","Wohngeld","Entwicklungshilfe"],"c":4,"n":"Erziehungsurlaub heißt heute Elternzeit.","e":"Kindergeld, Elterngeld, Elternzeit (früher Erziehungsurlaub), Wohngeld und BAföG unterstützen Familien. Entwicklungshilfe geht an andere Länder und hat mit Familienschutz nichts zu tun."},{"q":"Ab welchem Alter ist man rechtsfähig?","a":["Ab der Geburt","Ab dem 7. Lebensjahr","Ab dem 14. Lebensjahr","Ab dem 18. Lebensjahr","Ab dem 21. Lebensjahr"],"c":0,"n":"","e":"Rechtsfähig ist man ab der vollendeten Geburt (§ 1 BGB). Man ist dann Träger von Rechten und Pflichten, zum Beispiel kann man erben."},{"q":"Wie viel Prozent der Gewerkschaftsmitglieder müssen bei einer Urabstimmung einem Streik zustimmen?","a":["10 Prozent","30 Prozent","50 Prozent","75 Prozent","100 Prozent"],"c":3,"n":"","e":"Nach den Satzungen der meisten Gewerkschaften müssen bei der Urabstimmung mindestens 75 % der Mitglieder für einen Streik stimmen."},{"q":"Warum steht die Rentenversicherung vor großen Problemen?","a":["Weil es zu viele Pflegefälle gibt","Weil der Generationenvertrag durch die steigende Zahl der älteren Menschen gefährdet ist","Weil es zu viele Kinder gibt","Weil es zu wenige Kinder gibt","Weil das Rentenalter heraufgesetzt wurde"],"c":1,"n":"","e":"Die Renten werden aus den Beiträgen der heute Arbeitenden bezahlt. Weil es immer mehr Rentner und weniger junge Beitragszahler gibt, gerät dieses System unter Druck."},{"q":"Was versteht man unter dem Begriff „Aussperrung“?","a":["Die Arbeitgeber reagieren auf Streiks mit der Schließung ihrer Betriebe","Die Tarifpartner verhandeln ohne Beobachter","Die Gewerkschaftsmitglieder hindern Streikbrecher, in die Betriebe zu gehen","Die Tarifpartner dürfen Löhne selbständig aushandeln","Arbeitgeber verbieten den Gewerkschaftsmitgliedern, in ihren Betrieben zu arbeiten"],"c":4,"n":"","e":"Bei der Aussperrung schließt der Arbeitgeber Arbeitnehmer von der Arbeit aus und zahlt keinen Lohn. Sie ist das Gegenmittel der Arbeitgeber zum Streik."},{"q":"Welche der folgenden Aufzählungen enthält nur Punkte, die im Ausbildungsvertrag geregelt werden?","a":["Probezeit, Lohn, Urlaub, Stundenplan","Pflichten des Ausbildenden, Miete, Kündigung","Nachtarbeit, Lohn, Berufskleidung","Berichtsheftführung, Überstunden, Berufskleidung","Pflichten des Auszubildenden, Kündigung Urlaub"],"c":4,"n":"","e":"Ein Ausbildungsvertrag muss unter anderem Pflichten, Kündigungsvoraussetzungen und Urlaub regeln (§ 11 BBiG). Miete oder Stundenplan gehören nicht hinein."},{"q":"Welcher der folgenden Punkte wird nicht im Manteltarifvertrag geregelt?","a":["Arbeitszeit","Urlaub","Arbeitsschutz","Löhne und Gehälter","Kündigungsbedingungen"],"c":3,"n":"","e":"Der Manteltarifvertrag regelt allgemeine Arbeitsbedingungen wie Arbeitszeit, Urlaub und Kündigung. Löhne und Gehälter stehen im eigenen Lohn- bzw. Gehaltstarifvertrag."},{"q":"Welche der folgenden Aussagen ist richtig?","a":["Bei der 1. Urabstimmung müssen mindestens 75% der Arbeitnehmer für einen Streik stimmen","Bei der 1. Urabstimmung müssen mindestens 50% der Gewerkschaftsmitglieder für einen Streik stimmen","Bei der 1. Urabstimmung müssen mindestens 25% der Bevölkerung für einen Streik stimmen","Bei der 2. Urabstimmung müssen mindestens 75% der Arbeitnehmer dem Ende des Streiks zustimmen","Bei der 2. Urabstimmung müssen mindestens 25% der Gewerkschaftsmitglieder dem Ende des Streiks zustimmen"],"c":4,"n":"","e":"Für das Ende eines Streiks reicht bei der zweiten Urabstimmung meist, dass mindestens 25 % der Gewerkschaftsmitglieder dem Verhandlungsergebnis zustimmen."},{"q":"Während der Tarifverhandlungen legen die Arbeitnehmer für eine Stunde die Arbeit nieder. Wie kann man diese Maßnahme bezeichnen?","a":["Wilder Streik","Generalstreik","Aussperrung","Schlichtungsstreik","Warnstreik"],"c":4,"n":"","e":"Ein Warnstreik ist eine kurze Arbeitsniederlegung während laufender Tarifverhandlungen, um Druck zu machen."},{"q":"Erwerbswirtschaftliche Unternehmen sollen möglichst rentabel arbeiten. Was versteht man unter einer hohen Rentabilität?","a":["Möglichst viele Produkte in möglichst kurzer Zeit herstellen","Möglichst viele Produkte mit möglichst wenig Maschinen herstellen","Bei möglichst geringen Kapitalaufwand möglichst viel Gewinn erzielen","Möglichst viele Produkte verkaufen","Möglichst viele Verkaufsstellen eröffnen"],"c":2,"n":"","e":"Rentabilität zeigt, wie stark sich das eingesetzte Kapital verzinst: Gewinn geteilt durch Kapital. Hoch ist sie, wenn wenig Kapital viel Gewinn bringt."},{"q":"Was versteht man unter Gesellschaftsunternehmen?","a":["Unternehmen, die dem Staat gehören","Unternehmen, die nicht nur einer Person gehören","Unternehmen, die dem ganzen Volk dienen","Unternehmen, die sich mit anderen Unternehmen zusammengeschlossen haben","Unternehmen, die in der Gesellschaft eine feste Aufgabe haben"],"c":1,"n":"","e":"Gesellschaftsunternehmen gehören mehreren Personen, zum Beispiel OHG, KG, GmbH oder AG. Das Gegenteil ist die Einzelunternehmung."},{"q":"Wer vermittelt einem Arbeitslosen kostenlos einen neuen Arbeitsplatz?","a":["Die Bundesagentur für Arbeit","Die Arbeiterwohlfahrt","Die Handwerkskammer","Die Gewerkschaft","Die Berufsgenossenschaft"],"c":0,"n":"","e":"Die Bundesagentur für Arbeit (Agentur für Arbeit, früher Arbeitsamt) vermittelt Arbeitsstellen kostenlos."},{"q":"Welche der folgenden Aufgaben muss die Arbeitslosenversicherung nicht erfüllen?","a":["Zahlung von Arbeitslosengeld I","Durchführung von Fortbildungsmaßnahmen","Gewährung von Sozialhilfe","Durchführung von Umschulungsmaßnahmen","Zahlung von Arbeitslosengeld II"],"c":2,"n":"Arbeitslosengeld II wurde 2023 durch das Bürgergeld ersetzt.","e":"Sozialhilfe zahlt das Sozialamt aus Steuergeld, nicht die Arbeitslosenversicherung. Das Arbeitslosengeld II gibt es seit 2023 nicht mehr, es heißt jetzt Bürgergeld."},{"q":"An welche Stelle werden die Beiträge zur Arbeitslosenversicherung bezahlt?","a":["An die Krankenkasse","An die Landesversicherungsanstalt","An die Berufsgenossenschaft","An die Bundesanstalt für Arbeit","An die Rentenkasse"],"c":3,"n":"Die Bundesanstalt für Arbeit heißt seit 2004 Bundesagentur für Arbeit. Die Beiträge zieht in der Praxis die Krankenkasse als Einzugsstelle ein.","e":"Die Beiträge zur Arbeitslosenversicherung gehen an die Bundesagentur für Arbeit (früher Bundesanstalt). Eingezogen werden sie zusammen mit den anderen Beiträgen über die Krankenkasse."},{"q":"Wer bezahlt die Arztkosten, wenn man bei einem Arbeitsunfall verletzt wurde?","a":["Die Krankenkasse","Der Arbeitgeber","Die Gewerkschaft","Die Berufsgenossenschaft","Das Gewerbeaufsichtsamt"],"c":3,"n":"","e":"Nach einem Arbeitsunfall übernimmt die Berufsgenossenschaft als gesetzliche Unfallversicherung die Behandlungskosten. Dazu geht man zum Durchgangsarzt."},{"q":"Welche Aussage über die Berechnung der Rente stimmt?","a":["Die Höhe der Rente hängt nur davon ab, wie viel Beiträge man bezahlt hat","Die Rente bleibt immer gleich, man bekommt immer 75% des letzten Gehaltes","Die Rente wird danach berechnet, wie viel Einkommenssteuer man bezahlt hat","Die Rente wird jedes Jahr an die Entwicklung der Löhne und Gehälter angepasst","Die Rente wird jedes Jahr vom Bundestag festgesetzt"],"c":3,"n":"","e":"Die Renten werden jedes Jahr zum 1. Juli an die Entwicklung der Löhne angepasst. Das nennt man dynamische Rente."},{"q":"Welche Aussage über die Kommanditgesellschaft ist richtig?","a":["Die Komplementäre sind nur Teilhafter, d.h. sie haften nur mit ihrem Geschäftsanteil","Die Geschäftsführung liegt bei den Kommanditisten","Zur Gründung einer Kommanditgesellschaft sind mindestens zwei Gesellschafter erforderlich","Der Kommanditist ist Vollhafter, d.h. er haftet auch mit seinem Privatvermögen","Der Kommanditist vertritt die Gesellschaft nach außen"],"c":2,"n":"","e":"Eine KG braucht mindestens einen Komplementär (Vollhafter) und einen Kommanditisten (Teilhafter), also mindestens zwei Gesellschafter."},{"q":"Welches Recht steht dem Kommanditist einer Kommanditgesellschaft nicht zu?","a":["Recht auf Information über die Geschäftslage der Gesellschaft","Recht auf Gewinnbeteiligung","Recht auf Austritt aus der Gesellschaft","Recht auf Widerspruch bei außergewöhnlichen Rechtsgeschäften, z.B. Auflösung der Firma","Recht auf Teilnahme an der Geschäftsführung"],"c":4,"n":"","e":"Der Kommanditist ist nur Geldgeber und von der Geschäftsführung ausgeschlossen. Kontrollrechte und Gewinnbeteiligung hat er trotzdem."},{"q":"Welche Unternehmensform ist am besten für Unternehmungen mit sehr großem Kapitalbedarf geeignet?","a":["Offene Handelsgesellschaft","Aktiengesellschaft","Kommanditgesellschaft","Gesellschaft mit beschränkter Haftung","Genossenschaft"],"c":1,"n":"","e":"Die AG kann durch den Verkauf von Aktien an viele Anleger sehr viel Kapital sammeln. Deshalb eignet sie sich für Unternehmen mit großem Kapitalbedarf."},{"q":"Welche Aussage über die Aktiengesellschaft ist richtig?","a":["Die Rechtsform der AG ist nur für große Industriebetriebe erlaubt","Der Mindestnennbetrag des Grundkapitals beträgt 50.000,- €","Zur Gründung einer AG sind mindestens fünf Personen notwendig","Der Mindestnennbetrag einer Aktie beträgt 50,- €","Eigentümer der AG ist der Vorstandsvorsitzende"],"c":1,"n":"","e":"Laut Aktiengesetz muss das Grundkapital einer AG mindestens 50.000 € betragen. Eine AG kann schon eine Person gründen, und der Mindestnennbetrag einer Aktie liegt bei 1 €."},{"q":"Wie viele Personen sind zur Gründung einer AG erforderlich?","a":["Eine Person","Drei Personen","Fünf Personen","Sieben Personen","Zehn Personen"],"c":0,"n":"","e":"Seit 1994 kann auch eine einzelne Person eine AG gründen (Ein-Personen-AG)."},{"q":"Welches Grundkapital muss bei der Gründung einer Aktiengesellschaft mindestens aufgebracht werden?","a":["50.000,- €","100.000,- €","500.000,- €","1.000.000,- €","5.000.000,- €"],"c":0,"n":"","e":"Das Mindestgrundkapital einer Aktiengesellschaft beträgt 50.000 € (§ 7 AktG)."},{"q":"Wie hoch ist nach dem Aktiengesetz der Mindestnennwert einer deutschen Aktie?","a":["1 €","5 €","10 €","50 €","100 €"],"c":0,"n":"","e":"Nennbetragsaktien müssen auf mindestens 1 € lauten (§ 8 AktG)."},{"q":"Wie bildet sich an der Börse der Kurswert einer Aktie, also der Preis für eine Aktie?","a":["Durch Festsetzung durch den Aktienverkäufer","Durch Festsetzung durch den Aktienkäufer","Durch Festsetzung der staatlichen Aufsichtsbehörde","Durch Berechnung der Gewinne der Unternehmung","Durch Angebot und Nachfrage"],"c":4,"n":"","e":"An der Börse bildet sich der Kurs aus Angebot und Nachfrage. Wollen viele kaufen, steigt er, wollen viele verkaufen, fällt er."},{"q":"Wie wird man Aktionär?","a":["Durch Mitarbeit in der Aktiengesellschaft","Durch Kauf von mindestens einer Aktie","Durch Besuch einer Hauptversammlung eines Aktiengesellschaft","Durch regelmäßiges Studium der Aktienkurse","Durch die Wahl zum Vorstand einer Aktiengesellschaft"],"c":1,"n":"","e":"Aktionär wird man, indem man mindestens eine Aktie kauft, zum Beispiel über die Bank oder einen Online-Broker."},{"q":"Was versteht man unter einer Dividende?","a":["Wer mindestens 50 Aktien einer Unternehmung kauft erhält eine umsonst","Dividende ist eine anderer Name für Gesellschafter","Dividende ist der Lohn des Vorstandsvorsitzenden einer AG","Dividende ist der Titel des Geschäftsführers einer AG","Dividende ist der Gewinnanteil eines Aktionärs"],"c":4,"n":"","e":"Die Dividende ist der Teil des Gewinns, den die AG an ihre Aktionäre ausschüttet. Die Höhe beschließt die Hauptversammlung."},{"q":"Was bedeutet die Abkürzung GmbH?","a":["Gemeinschaft mit beschränkter Haftung","Gesellschaft mit betrieblicher Haftung","Genossenschaft mit beschränkter Haftung","Gemeinschaft mit betrieblicher Haftung","Gesellschaft mit beschränkter Haftung"],"c":4,"n":"","e":"GmbH steht für Gesellschaft mit beschränkter Haftung, weil die Haftung auf das Gesellschaftsvermögen beschränkt ist."},{"q":"Welches Grundkapital muss bei der Gründung einer GmbH mindestens aufgebracht werden?","a":["50.000,- €","100.000,- €","500.000,- €","1.000.000,- €","25.000,- €"],"c":4,"n":"","e":"Das Stammkapital einer GmbH muss mindestens 25.000 € betragen. Für die kleine Variante UG (haftungsbeschränkt) reicht schon 1 €."},{"q":"Wer vertritt die GmbH nach außen?","a":["Ein oder mehrere Geschäftsführer","Die Aktionäre","Der Kommanditist","Der Komplementär","Der Aufsichtsrat"],"c":0,"n":"","e":"Die GmbH wird vom Geschäftsführer vertreten. Das können auch mehrere sein."},{"q":"Womit haften die Gesellschafter einer GmbH?","a":["Mit ihrem Privatvermögen","Mit ihrem Geschäftsvermögen","Mit ihrem Privat- und Geschäftsvermögen","Mit ihren Dividenden","Mit ihren Aktien"],"c":1,"n":"","e":"Für Schulden der GmbH haftet nur das Gesellschaftsvermögen. Das Privatvermögen der Gesellschafter ist geschützt."},{"q":"Welche Aussage zur Beitragsregelung in der gesetzlichen Unfallversicherung ist falsch?","a":["Nur der Arbeitgeber ist beitragspflichtig","Die Beitragshöhe wird für die Betriebe jährlich neu nach der Unfallhäufigkeit festgelegt","Die Beitragshöhe richtet sich nach der jeweiligen Gefahrenklasse und der Größe des Betriebes","Arbeitgeber und Arbeitnehmer zahlen je die Hälfte der Beiträge","Die Beiträge werden an die Berufsgenossenschaft bezahlt"],"c":3,"n":"","e":"Falsch ist die halbe Aufteilung: Die Unfallversicherung zahlt der Arbeitgeber allein. Die Beitragshöhe hängt von der Gefahrenklasse und der Lohnsumme ab."},{"q":"Was versteht man bei der Rentenversicherung unter dem „Generationenvertrag“?","a":["Die von den Beitragspflichtigen einbezahlten Beiträge werden sofort an die derzeitigen Rentner ausbezahlt","Die Beiträge der Einzelnen werden angesammelt und im Alter als Rente ausbezahlt","Die jüngere Generation sichert der älteren eine regelmäßige Rentenerhöhung zu","Die Beiträge werden angelegt und dem Versicherten in voller Höhe sofort ausbezahlt","Bei einem Generationswechsel werden die Rentenzahlungen neu geregelt"],"c":0,"n":"","e":"Beim Generationenvertrag (Umlageverfahren) zahlen die heute Arbeitenden mit ihren Beiträgen direkt die Renten der heutigen Rentner. Angespart wird nichts."},{"q":"Für welche Verwandten muss in einer Notlage k e i n Unterhalt bezahlt werden?","a":["Für die Eltern","Für die Enkel","Für die Kinder","Für die Großeltern","Für die Geschwister"],"c":4,"n":"","e":"Unterhaltspflichtig sind nur Verwandte in gerader Linie, also Eltern, Kinder, Großeltern und Enkel. Geschwister sind sich keinen Unterhalt schuldig."},{"q":"Was sind die gesetzlichen Erben erster Ordnung?","a":["Die Eltern des / der Verstorbenen","Die Geschwister des / der Verstorbenen","Onkel und Tante des / der Verstorbenen","Die Kinder (Abkömmlinge) des / der Verstorbenen","Der Ehegatte bzw. Ehegattin des / der Verstorbenen"],"c":3,"n":"","e":"Erben erster Ordnung sind die Abkömmlinge: Kinder, Enkel und Urenkel. Der Ehepartner hat ein eigenes Erbrecht neben den Ordnungen."},{"q":"Ein vom Erblasser geschriebenes und zu Hause aufbewahrtes Testament:","a":["hat keine Beweiskraft und ist daher bedeutungslos","ist rechtlich unwirksam","soll vollständig mit Schreibmaschine geschrieben sein","muss vom Bürgermeister beglaubigt sein","muss vollständig von Hand geschrieben und unterschrieben sein, damit es rechtswirksam ist"],"c":4,"n":"","e":"Ein eigenhändiges Testament ist nur gültig, wenn es komplett von Hand geschrieben und unterschrieben ist. Ort und Datum sollten dabei stehen."},{"q":"Welche Aussage über die Rechtsstellung zwischen Ehepartnern stimmt n i c h t?","a":["Die Ehepartner entscheiden gemeinsam über die Fragen der Kindererziehung","Frau und Mann können beide berufstätig sein","Eine Hausfrau darf rechtskräftig, auch mit Wirkung für den Ehemann, Geschäfte für den Lebensbedarf der Familie tätigen","Kindererziehung und Haushalt sind grundsätzlich Aufgaben der Ehefrau, mit Zustimmung des Mannes darf sie einer Berufstätigkeit nachgehen","Jeder Ehepartner darf allein rechtsgültige Verträge, z.B. eine Haftpflichtversicherung, abschließen"],"c":3,"n":"","e":"Diese Aussage stimmt nicht, denn Mann und Frau sind gleichberechtigt (Art. 3 GG). Beide dürfen ohne Zustimmung des anderen berufstätig sein."},{"q":"In der Bundesrepublik Deutschland kann einem Erben der Pflichtteil entzogen werden, wenn er:","a":["eine vom Erblasser nicht gewünschte Ehe eingeht","sich schweren Verfehlungen gegenüber dem Erblasser schuldig gemacht hat, z.B. schwere Körperverletzung","seinen Wohnsitz im Ausland hat","seit mehr als 20 Jahren keinen Kontakt zum Erblasser hatte","sich mehrmals zu Lebzeiten mit dem Erblasser gestritten hat"],"c":1,"n":"","e":"Der Pflichtteil kann nur bei schweren Verfehlungen entzogen werden, etwa wenn der Erbe dem Erblasser nach dem Leben trachtet oder ihn schwer misshandelt (§ 2333 BGB)."},{"q":"Das Verlöbnis ist in rechtlicher Hinsicht:","a":["ein einklagbares Eheversprechen","ein ungültiger Vertrag","ein Vertrag, der die nicht erzwingbare Verpflichtung zur späteren Eheschließung begründet","eine grundsätzliche Voraussetzung für die Gültigkeit der späteren Ehe","ein nicht mehr erlaubtes Eheversprechen"],"c":2,"n":"","e":"Das Verlöbnis ist ein Eheversprechen. Auf die Eheschließung kann man aber nicht klagen (§ 1297 BGB)."},{"q":"Die gesetzliche Erbfolge tritt ein, wenn:","a":["dies testamentarisch verfügt ist","ein mehr als 10 Jahre altes Testament vorliegt","kein Erbe durch Testament oder Erbvertrag bestimmt wurde","Gütergemeinschaft vereinbart wurde","das Testament von den Erben angefochten wird"],"c":2,"n":"","e":"Gibt es kein Testament und keinen Erbvertrag, regelt das BGB, wer erbt. Das ist die gesetzliche Erbfolge."},{"q":"Durch welche Aussage wird der Begriff Wirtschaftpolitik ausreichend erklärt? Unter Wirtschaftspolitik versteht man:","a":["die Entscheidung in Konzernen über die Verlagerung der Produktion ins Ausland","die Diskussion unter Politikern über die wirtschaftliche Lage in Deutschland","die Entwicklungen und Maßnahmen des Staates, die das wirtschaftliche Geschehen und die Entwicklung auf breiter Ebene beeinflussen","die Entscheidungen und Maßnahmen der Arbeitgeber und der Gewerkschaften für die Betriebe und die Arbeitnehmer","Fragestunde und Debatten im Deutschen Bundestag zur wirtschaftlichen Lage Deutschlands"],"c":2,"n":"","e":"Wirtschaftspolitik umfasst alle Maßnahmen des Staates, mit denen er die Wirtschaft beeinflusst, zum Beispiel über Steuern, Ausgaben oder Gesetze."},{"q":"Welche Maßnahme ist in der Sozialen Marktwirtschaft n i c h t zulässig?","a":["Steuererhöhungen durch den Staat","Festlegen der Preise durch den Staat","Preiserhöhungen durch die Unternehmer","Entlassung von Arbeitnehmern","Billiger zu verkaufen als die Konkurrenz"],"c":1,"n":"","e":"In der sozialen Marktwirtschaft bilden sich die Preise frei am Markt. Staatlich festgesetzte Preise gehören zur Planwirtschaft."},{"q":"Durch welchen Vorgang am Markt können die Preise von Waren sinken?","a":["Die Herstellungskosten werden über Jahre stabil gehalten","Die Nachfrage steigt stark an","Der Hersteller treibt mehr Werbung für seine Ware","Das Einkommen der Käufer (Verbraucher) steigt nominal an","Das Warenangebot steigt durch Konkurrenz aus dem Ausland stark an"],"c":4,"n":"","e":"Steigt das Angebot stärker als die Nachfrage, zum Beispiel durch billige Konkurrenz aus dem Ausland, sinken die Preise."},{"q":"Unter dem Begriff „Ressourcen“ versteht man:","a":["Rohstoffe und Energie","Naturschutzgesetze","Abfallstoffe","unbegrenzt vorhandene Güter","Recycling"],"c":0,"n":"","e":"Ressourcen sind natürliche Rohstoffe und Energiequellen wie Öl, Gas, Erze, Wasser oder Holz. Viele sind begrenzt."},{"q":"Ein Arbeitnehmer erkrankt während seines Urlaubs. Welche Aussage ist richtig?","a":["Die Tage der Arbeitunfähigkeit werden zur Hälfte auf den Jahresurlaub angerechnet","Die Tage der Arbeitsunfähigkeit werden voll auf den Jahresurlaub angerechnet","Werden die Tage der Arbeitsunfähigkeit ärztlich nachgewiesen, so erfolgt keine Anrechnung auf den Urlaub","Die Arbeitsunfähigkeit wird nur dann nicht angerechnet, wenn die Erkrankung in der BRD auftrat","Die Tage der Arbeitsunfähigkeit werden nicht auf den Jahresurlaub angerechnet, wenn die Erkrankung stationär behandelt wurde"],"c":2,"n":"","e":"Krankheitstage im Urlaub, die mit ärztlichem Attest nachgewiesen sind, werden nicht auf den Urlaub angerechnet (§ 9 Bundesurlaubsgesetz). Man bekommt sie also gutgeschrieben."},{"q":"Wofür steht die Abkürzung „BGB“?","a":["Bundesgesetzbuch","Bayerisches Gesetzblatt","Bürgerliches Gerichtsbuch","Bürgerliches Gesetzbuch","Bundesgerichtsbuch"],"c":3,"n":"","e":"BGB heißt Bürgerliches Gesetzbuch. Es regelt das Privatrecht, zum Beispiel Verträge, Familie und Erbe."},{"q":"In welchem Fall kann die fristlose Entlassung eines Arbeitnehmers erfolgen?","a":["Verrat von Betriebsgeheimnissen","Arbeitsmangel","Eintägiges unentschuldigtes Fehlen","Unverschuldete Krankheit","Schlechte Noten in der Berufsschule"],"c":0,"n":"","e":"Eine fristlose Kündigung braucht einen wichtigen Grund (§ 626 BGB), zum Beispiel Diebstahl oder den Verrat von Betriebsgeheimnissen. Bei kleineren Verstößen muss meist erst abgemahnt werden."},{"q":"Welche allgemeinen Aufgaben hat ein Betriebsrat nach dem Betriebsverfassungsgesetz?","a":["Er vertritt die Interessen der Arbeitgeber gegenüber den Arbeitnehmern","Er vertritt die Interessen der Gewerkschaft im Betrieb gegenüber dem Arbeitgeber","Er wirbt Mitglieder für die Gewerkschaft im Betrieb","Er vertritt die Interessen der Belegschaft eines Betriebes gegenüber dem Arbeitgeber","Er vertritt die Interessen der Arbeitgeber gegenüber der Gewerkschaft"],"c":3,"n":"","e":"Der Betriebsrat vertritt die Interessen aller Arbeitnehmer im Betrieb gegenüber dem Arbeitgeber und hat dazu Mitwirkungs- und Mitbestimmungsrechte."},{"q":"Die Tarifpartner können ohne Eingriffe des Staates verhandeln. Wie nennt man dieses Recht der Tarifpartner?","a":["Tarifaussperrung","Tarifsolidarität","Tarifautonomie","Tarifimmunität","Tarifkonjunktur"],"c":2,"n":"","e":"Tarifautonomie ist das Recht von Gewerkschaften und Arbeitgeberverbänden, Tarifverträge ohne Eingriff des Staates auszuhandeln (Art. 9 Abs. 3 GG)."},{"q":"Wonach richtet sich die Höhe des Monatsbeitrages zur Krankenkasse, die ein Pflichtversicherter bezahlen muss?","a":["Nach der gesundheitlichen Gefährdung, der der Versicherte durch seine Arbeit ausgesetzt ist","Nach dem durchschnittlichen Verdienst aller Versicherten","Nach der Anzahl der Familienmitglieder, die mitversichert sind","Nach der Höhe des monatlichen Bruttogehaltes des Versicherten","Nach der Höhe des monatlichen Nettogehaltes des Versicherten"],"c":3,"n":"","e":"Der Krankenkassenbeitrag ist ein fester Prozentsatz vom Bruttogehalt (allgemein 14,6 % plus Zusatzbeitrag), aber nur bis zur Beitragsbemessungsgrenze. Alter und Gesundheit spielen keine Rolle."},{"q":"Was versteht man unter dem „dualen Ausbildungssystem“?","a":["Teilzeit- und Vollzeitunterricht","Auszubildende und Ausbildender haben sowohl Rechte als auch Pflichten","Die Ausbildung ist in betriebliche und schulische Ausbildung aufgegliedert","Die Ausbildungszeit umfasst Ausbildungsabschnitte, wobei die Zwischenprüfung die Halbzeit kennzeichnet","Die überbetriebliche Ausbildung erfolgt in der Handwerkskammer"],"c":2,"n":"","e":"Dual heißt zweigleisig: Man lernt praktisch im Betrieb und theoretisch in der Berufsschule."},{"q":"Welches Gesetz regelt die Pausen, Arbeitszeit und Mehrarbeit für volljährige Mitarbeiter/innen?","a":["Betriebsverfassungsgesetz","Handwerksordnung","Arbeitsgesetz","Jugendarbeitsschutzgesetz","Ausbildungsordnung"],"c":2,"n":"Gemeint ist das Arbeitszeitgesetz (ArbZG).","e":"Gemeint ist das Arbeitszeitgesetz (ArbZG). Es regelt für Erwachsene unter anderem den 8-Stunden-Tag (bis 10 Stunden möglich), Pausen und Ruhezeiten. Für Jugendliche gilt das Jugendarbeitsschutzgesetz."},{"q":"Welches Amt kann aus dringenden Gründen eine Arbeitszeitverlängerung über das gesetzlich zulässige Stundenmaß hinaus gestatten?","a":["Arbeitsamt","Gewerbeaufsichtsamt","Berufsgenossenschaft","Jugendamt","Sozialamt"],"c":1,"n":"","e":"Ausnahmen von den gesetzlichen Arbeitszeiten genehmigt die Aufsichtsbehörde, also das Gewerbeaufsichtsamt bzw. Amt für Arbeitsschutz."},{"q":"Wer erlässt Arbeitsschutzgesetze?","a":["Gewerbeaufsichtsamt","Bundestag","Arbeitsamt","Gewerkschaft","Handwerkskammer"],"c":1,"n":"","e":"Gesetze beschließt das Parlament, also der Bundestag (mit Beteiligung des Bundesrats). Behörden wie das Gewerbeaufsichtsamt überwachen sie nur."},{"q":"Welche Institution in der BRD hat die Aufgabe, eine Einschränkung des wirtschaftlichen Wettbewerbs zu verhindern?","a":["Bundesregierung","Bundesverfassungsgericht","Bundeskartellamt","Bundesgerichtshof","Bundestag"],"c":2,"n":"","e":"Das Bundeskartellamt in Bonn schützt den Wettbewerb. Es verbietet Preisabsprachen (Kartelle) und prüft Firmenzusammenschlüsse."},{"q":"Welche Versicherung rechnet man zu den Sozialversicherungen?","a":["Lebensversicherung","Kfz-Haftpflichtversicherung","Krankenversicherung","Reisegepäckversicherung","Lohnsteuer"],"c":2,"n":"","e":"Die fünf Sozialversicherungen sind Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung. Lebens-, Kfz- und Reiseversicherungen sind private Versicherungen."},{"q":"Welche Organisation vertritt die Interessen eines Handwerksberufes?","a":["Kreishandwerkerschaft","Zentralverband des deutschen Handwerks","Handwerkskammer","Innung","Berufsgenossenschaft"],"c":3,"n":"","e":"Die Innung ist der freiwillige Zusammenschluss der selbständigen Handwerker eines Berufs in einer Region und vertritt deren Interessen."},{"q":"Wie kommen Tarifverträge im Handwerk zustande?","a":["Sie werden vom Bundestag beschlossen","Sie werden von der Bundesregierung erlassen","Sie werden von Gewerkschaften und Landesinnungsverbänden geschlossen","Sie werden von der Gewerkschaft und dem Deutschen Konditorenbund geschlossen","Sie werden von der Gewerkschaft NGG und der Handwerkskammer abgeschlossen"],"c":2,"n":"","e":"Im Handwerk handeln die Landesinnungsverbände (für die Arbeitgeber) mit den Gewerkschaften die Tarifverträge aus."},{"q":"Ein Laden wird neu eingerichtet. Mit welchem Fachwort kann man dies bezeichnen?","a":["Dividende","Umsatz","Investition","Kredit","Inflation"],"c":2,"n":"","e":"Wer Geld für Anlagen wie Einrichtung oder Maschinen ausgibt, die länger im Betrieb bleiben, tätigt eine Investition."},{"q":"Welches Produkt ist ein Konsumgut?","a":["Baumkuchen","Ladentheke","Backofen","Speiseeisbereiter","Knetmaschine"],"c":0,"n":"","e":"Konsumgüter werden von Verbrauchern verbraucht oder genutzt, zum Beispiel Lebensmittel. Ladentheke, Backofen und Maschinen sind Investitionsgüter für die Produktion."},{"q":"Wer ist berechtigt, Geld in Umlauf zu bringen, und ist gleichzeitig verpflichtet, die Geldmenge zu steuern?","a":["Allein die Bundesregierung","Bundesregierung und Bundestag","Sparkassen und Geschäftsbanken","Die europäische Zentralbank","Das Bundeskartellamt"],"c":3,"n":"","e":"Im Euroraum hat die Europäische Zentralbank das Recht, Geld auszugeben, und steuert die Geldmenge, um die Preise stabil zu halten."},{"q":"Welche Maßnahmen kann der Staat zur Belebung der Gesamtwirtschaft ergreifen?","a":["Die Steuern erhöhen","Die Beiträge zur Rentenversicherung erhöhen","Verschärfte Richtlinien erlassen","Straßen und Wohnheime bauen","Einen neuen Bundeskanzler wählen"],"c":3,"n":"","e":"Mit öffentlichen Aufträgen wie Straßen- und Wohnungsbau schafft der Staat Nachfrage und Arbeit. Steuer- oder Beitragserhöhungen würden die Wirtschaft dagegen bremsen."},{"q":"Welchen Anteil bezahlt ein pflichtversicherter Arbeitnehmer zur gesetzlichen Krankenversicherung?","a":["Einen freiwilligen Zuschuss","Den gesamten Beitrag","Drei Viertel des Beitrages","Die Hälfte des Beitrages","Grundsätzlich 14%"],"c":3,"n":"","e":"Den allgemeinen Beitrag zur Krankenversicherung teilen sich Arbeitnehmer und Arbeitgeber je zur Hälfte, seit 2019 auch den Zusatzbeitrag."},{"q":"Mit welchem Alter ist man voll geschäftsfähig?","a":["Mit 7 Jahren","Mit der Geburt","Mit 18 Jahren","Mit 21 Jahren","Mit 14 Jahren"],"c":2,"n":"","e":"Mit 18 Jahren ist man volljährig und voll geschäftsfähig. Man kann dann alle Verträge allein wirksam abschließen."},{"q":"Welche Pflicht hat ein Geselle?","a":["Sorgfältiges Ausführen der ihm übertragenen Arbeiten","Befolgen von Weisungen im familiären und privaten Bereich","Weitergabe von Rezepten aus seinem Lehrbetrieb","Eigenverantwortlich Ausbildung von Lehrlingen","Sich zur Meisterprüfung anmelden"],"c":0,"n":"","e":"Ein Geselle schuldet seinem Arbeitgeber vor allem sorgfältige Arbeit nach dessen Weisungen. Ins Privatleben darf der Chef nicht hineinbestimmen."},{"q":"Welche Stelle überwacht, ob eine Firma zur Lehrlingsausbildung geeignet ist?","a":["Handwerkskammer","Bundeswirtschaftsministerium","Betriebsrat","Landesinnungsverband","Berufsschule"],"c":0,"n":"","e":"Die Handwerkskammer prüft als zuständige Stelle, ob ein Betrieb und der Ausbilder zur Ausbildung geeignet sind, und überwacht die Ausbildung."},{"q":"Welches Gericht gehört zur ordentlichen Gerichtsbarkeit?","a":["Sozialgericht","Arbeitsgericht","Verwaltungsgericht","Finanzgericht","Strafgericht"],"c":4,"n":"","e":"Zur ordentlichen Gerichtsbarkeit gehören die Zivil- und Strafgerichte. Arbeits-, Sozial- und Verwaltungsgerichte sind eigene Fachgerichtsbarkeiten."},{"q":"Was versteht man unter dem Begriff Nettolohn?","a":["Der Verdienst vor Abzug von Steuern und Sozialabgaben","Die Summe der Lohnabzüge","Den Verdienst nach Abzug der Steuern und Sozialabgaben","Den Verdienst ohne Überstunden","Der Lohn nach Abzug der Steuern, aber vor Abzug der Sozialabgaben"],"c":2,"n":"","e":"Netto ist, was nach Abzug von Steuern (Lohnsteuer, ggf. Kirchensteuer und Soli) und Sozialabgaben vom Bruttolohn übrig bleibt."},{"q":"In welchem Fall braucht der Arbeitgeber den Lohn nicht fortzuzahlen?","a":["Bei der Ausübung einer Schwarzarbeit verletzt sich der Arbeitnehmer","Bei der Wanderung im Urlaub verstaucht sich der Geselle den Knöchel","Der Arbeitnehmer bricht sich beim Skifahren das Bein","Der Arbeitnehmer verunglückt beim Betriebssport","Der Arbeitnehmer erleidet auf dem Weg zur Arbeit einen komplizierten Armbruch"],"c":0,"n":"","e":"Lohnfortzahlung gibt es nur bei unverschuldeter Krankheit. Wer sich bei Schwarzarbeit verletzt, hat sich selbst schuldhaft in Gefahr gebracht."},{"q":"Wer zahlt die Beiträge zur Krankenversicherung für einen Arbeitslosen?","a":["Die Bundesregierung","Die Landesregierung","Das Sozialamt der Wohngemeinde","Die Bundesanstalt für Arbeit","Der frühere Arbeitgeber"],"c":3,"n":"Heute: Bundesagentur für Arbeit (früher Bundesanstalt für Arbeit).","e":"Für Bezieher von Arbeitslosengeld zahlt die Agentur für Arbeit (früher Bundesanstalt) die Kranken- und Pflegeversicherung. Beim Bürgergeld übernimmt das das Jobcenter."},{"q":"Welche volkswirtschaftliche Aufgabe hat das Handwerk?","a":["In der Hauptsache Facharbeiter für die Industrie ausbilden","Die individuellen Bedürfnisse und Wünsche der Verbraucher befriedigen","Eine große Masse an Seriengütern herzustellen, die den täglichen Bedarf decken","Rohstoffe zu gewinnen und zu Halbfabrikaten zu verarbeiten","Allen Arbeitslosen eine Arbeitsstelle anbieten"],"c":1,"n":"","e":"Das Handwerk fertigt meist Einzelstücke und erbringt Dienstleistungen nach Kundenwunsch, anders als die Industrie mit ihrer Massenproduktion."},{"q":"Welches Gericht befasst sich mit Diebstählen am Arbeitsplatz?","a":["Zivilgericht","Strafgericht","Arbeitsgericht","Finanzgericht","Verwaltungsgericht"],"c":1,"n":"","e":"Diebstahl ist eine Straftat. Darüber entscheidet das Strafgericht, auch wenn er am Arbeitsplatz passiert."},{"q":"Welche Steuern sind indirekte Steuern?","a":["Mineralöl-, Kaffeesteuer","Einkommen-, Lohnsteuer","Grund-, Grunderwerbssteuer","Kraftfahrzeug-, Hundesteuer","Kirchen-, Gewerbesteuer"],"c":0,"n":"","e":"Indirekte Steuern zahlt der Verbraucher über den Preis, abgeführt werden sie vom Händler oder Hersteller, zum Beispiel Mehrwert-, Energie- (früher Mineralöl-) und Kaffeesteuer. Direkte Steuern wie die Lohnsteuer zahlt man selbst."},{"q":"Wer kommt für Unfallschäden auf, die auf dem Weg zur Arbeit aufgetreten sind?","a":["Krankenversicherung","Arbeitsamt","Arbeitgeber","Berufsgenossenschaft","Der Geschädigte selbst"],"c":3,"n":"","e":"Ein Unfall auf dem direkten Weg zur oder von der Arbeit ist ein Wegeunfall. Dafür kommt die gesetzliche Unfallversicherung (Berufsgenossenschaft) auf."},{"q":"Wie kann sich ein Bürger gegen ein Arbeitsgerichtsurteil wehren?","a":["Durch Beschwerde beim Gerichtpräsidenten","Durch Anrufung eines höheren Gerichts","Durch Widerspruch bei der Regierung","Durch Gegenvorstellung bei der Behörde","Beim Richter persönlich vorstellig werden"],"c":1,"n":"","e":"Gegen ein Urteil des Arbeitsgerichts kann man Berufung beim Landesarbeitsgericht einlegen, danach unter Umständen Revision beim Bundesarbeitsgericht."},{"q":"Wer stellt die Lohnsteuerkarte aus?","a":["Gemeinde","Finanzamt","Arbeitgeber","Steuerberater","Lohnsteueramt"],"c":0,"n":"Korrigiert: In der Original-App war „Arbeitgeber“ als richtig hinterlegt. Ausgestellt hat die Lohnsteuerkarte die Gemeinde. Seit 2013 gibt es sie nicht mehr (ELStAM).","e":"Die Lohnsteuerkarte stellte früher die Wohngemeinde aus. Seit 2013 gibt es sie nicht mehr; der Arbeitgeber ruft die Daten elektronisch beim Finanzamt ab (ELStAM)."},{"q":"Was versteht man unter Lebensstandard?","a":["Kaufkraft des Geldes","Maß, mit dem eine Person oder ein Volk materielle Bedürfnisse befriedigt","Soziale Leistungen der Versicherungsträger","Volkseinkommen einer Periode","Summe aller Dienstleistungen eines Volkes"],"c":1,"n":"Korrigiert: In der Original-App war „Soziale Leistungen der Versicherungsträger“ als richtig hinterlegt, das ist aber falsch.","e":"Der Lebensstandard beschreibt, wie gut Menschen ihre materiellen Bedürfnisse befriedigen können, also Wohnen, Essen, Konsum und Freizeit."},{"q":"Was versteht man unter Reallohn?","a":["Gefahrenzulage zum Grundlohn","Lohnform, die neben der Leistung auch soziale Verhältnisse des Arbeitnehmers berücksichtigt","Die vom Betrieb ausgezahlte Lohnsumme","Wert der Gütermenge, die mit dem Nettolohn gekauft werden kann","Lohn nach Abzug der Steuern und Sozialabgaben"],"c":3,"n":"","e":"Der Reallohn zeigt, was man sich vom Lohn tatsächlich kaufen kann. Steigen die Preise stärker als der Lohn, sinkt der Reallohn."},{"q":"Was ist Inflation?","a":["Geldaufwertung","Geldentwertung","Passive Zahlungsbilanz","Staatsbankrott","Geldbewertung"],"c":1,"n":"","e":"Bei Inflation steigen die Preise allgemein. Man bekommt für das gleiche Geld weniger, das Geld verliert an Wert."},{"q":"Muss die erste Nachuntersuchung nach dem Jugendarbeitsschutzgesetz erfolgen?","a":["Vor Ablauf der Probezeit","Nach Ablauf der Probezeit","Auf Verlangen des Arbeitgebers","Ein Jahr nach Aufnahme der ersten Beschäftigung","Spätestens nach 6 Monaten"],"c":3,"n":"","e":"Jugendliche brauchen vor der ersten Beschäftigung eine Erstuntersuchung. Ein Jahr nach Arbeitsbeginn muss die erste Nachuntersuchung erfolgen (§ 33 JArbSchG)."},{"q":"Wer ist durch Arbeitslosigkeit am meisten gefährdet?","a":["Selbständige","Personen ohne Berufsausbildung","Facharbeiter","Akademiker","Lehrlinge"],"c":1,"n":"","e":"Ungelernte haben das höchste Arbeitslosigkeitsrisiko, weil einfache Tätigkeiten leicht wegrationalisiert oder ins Ausland verlagert werden."},{"q":"Wer gibt Unfallverhütungsvorschriften und Warnplakate zur Arbeitssicherheit heraus?","a":["Berufsgenossenschaft","Polizei","Gewerbeaufsichtsamt","Technischer Überwachungsverein","Handwerkskammer"],"c":0,"n":"","e":"Die Berufsgenossenschaften geben Unfallverhütungsvorschriften (heute DGUV-Vorschriften) und Warnplakate heraus und beraten die Betriebe."},{"q":"Welche Institution ist nach dem Berufsbildungsgesetz (BiBG) für die Berufsausbildung zuständig?","a":["Arbeitsamt","Handwerkskammer","Kultusministerium","Berufsgenossenschaft","Gewerbeaufsichtsamt"],"c":1,"n":"","e":"Für die Ausbildung im Handwerk ist nach dem Berufsbildungsgesetz die Handwerkskammer die zuständige Stelle. In Industrie und Handel ist es die IHK."},{"q":"Wie lange wird in Krankheitsfall dem Arbeitnehmer Lohn weitergezahlt?","a":["1 Woche","8 Tage","14 Tage","6 Wochen","6 Monate"],"c":3,"n":"","e":"Bei Krankheit zahlt der Arbeitgeber bis zu 6 Wochen den vollen Lohn weiter (Entgeltfortzahlungsgesetz). Danach zahlt die Krankenkasse Krankengeld."},{"q":"Wie bezeichnen wir eine Gruppe von Abgeordneten einer Partei im Land- oder Bundestag?","a":["Fraktion","Parlamentsausschuss","Interessengruppe","Koalition","Opposition"],"c":0,"n":"","e":"Die Abgeordneten einer Partei bilden im Parlament eine Fraktion. Eine Koalition ist dagegen ein Bündnis mehrerer Parteien zur Regierungsbildung."},{"q":"Welche Vereinbarung darf in einem Berufsausbildungsvertrag nicht stehen?","a":["Beginn und Dauer der Ausbildung","Ausbildungsvergütung","Überstundenregelung","Dauer der täglichen Ausbildungszeit","Urlaubstage"],"c":2,"n":"","e":"Ausbildungsverträge dürfen nichts enthalten, was den Azubi benachteiligt (§ 12 BBiG). Feste Überstundenpflichten widersprechen dem Ausbildungszweck; Mehrarbeit muss besonders vergütet oder ausgeglichen werden."},{"q":"Welche Steuer gehört zu den Verkehrssteuern?","a":["Mehrwertsteuer","Gewerbesteuer","Grundsteuer","KFZ-Steuer","Lohnsteuer"],"c":0,"n":"","e":"Verkehrsteuern fallen auf Rechtsgeschäfte und Umsätze an. Die Mehrwertsteuer (Umsatzsteuer) zählt dazu, ebenso die Grunderwerbsteuer."},{"q":"Wie heißt die größte Arbeitnehmerorganisation?","a":["Deutscher Beamtenbund","Deutsche Angestelltengewerkschaft (DAG)","Christlicher Gewerkschaftsbund Deutschlands(CGB)","Deutscher Gewerkschaftsbund (DGB)","IG Metall"],"c":3,"n":"","e":"Der Deutsche Gewerkschaftsbund (DGB) ist der Dachverband von acht Einzelgewerkschaften, darunter IG Metall und ver.di, und damit die größte Arbeitnehmerorganisation."},{"q":"Was bedeutet Tarifautonomie?","a":["Das alleinige Recht der Sozialpartner, Tarifverträge abzuschließen","Das Selbstbestimmungsrecht der Tarifpartner","Die automatische Schlichtung bei Streiks","Das Recht in autoritären Staaten die Lohnzahlung nach freien Ermessen vorzunehmen","Die Schule und der Betrieb bilden im dualen System aus"],"c":0,"n":"","e":"Tarifautonomie bedeutet, dass nur die Sozialpartner, also Gewerkschaften und Arbeitgeber(verbände), Tarifverträge abschließen. Der Staat mischt sich nicht ein."},{"q":"Welcher Wirtschaftsbereich hat nach dem 2. Weltkrieg in der BRD den größten Zuwachs an Erwerbstätigen zu verzeichnen?","a":["Landwirtschaft","Industrie","Bergbau","Dienstleistungen","Bäckereigewerbe"],"c":3,"n":"","e":"Nach dem Krieg wuchs vor allem der Dienstleistungssektor (Handel, Banken, Gesundheit, IT), während Landwirtschaft und Bergbau Arbeitsplätze verloren."},{"q":"Was bedeutet Rentendynamisierung?","a":["Angleichung der Beiträge an die Leistungen der Rentenversicherung","Staatlich garantierte jährliche Erhöhung der Rente um 5%","Laufende Anpassung der Renten an die Lohn- und Gehaltsentwicklung","Renten bleiben immer gleich hoch","Bei einer hohen Inflation sinken die Renten"],"c":2,"n":"","e":"Dynamisierung heißt, dass die Renten jedes Jahr an die Lohnentwicklung angepasst werden, damit Rentner am wachsenden Wohlstand teilhaben."},{"q":"Manchen Zeitungen wird vorgeworfen, Meinung zu machen oder vorhandene Meinungsströmungen durch Informationsauswahl zu verstärken. Wie nennt man diese Beeinflussungen?","a":["Demokratisierung","Argumentation","Manipulation","Zensierung","Republik"],"c":2,"n":"","e":"Wer durch gezielte Auswahl oder Verzerrung von Informationen Meinungen lenkt, betreibt Manipulation."},{"q":"Mit welchem Fachausdruck bezeichnet man eine wirtschaftliche Lage, wenn die Unternehmer weniger Aufträge erhalten und Arbeitskräfte entlassen müssen?","a":["Hochkonjunktur","Rezession","Expansion","Inflation","Rationalisierung"],"c":1,"n":"","e":"Weniger Aufträge, sinkende Produktion und Entlassungen sind Kennzeichen der Rezession, also des Abschwungs."},{"q":"Was versteht man unter Vollbeschäftigung?","a":["Jeder sollte 40 Stunden pro Woche arbeiten","Jeder Betrieb muss eine bestimmte Anzahl von Auszubildenden einstellen","Jeder Einwohner Deutschlands muss arbeiten","Jeder, der arbeiten will, findet einen Arbeitsplatz","Während der achtstündigen Arbeit gibt es keine Pausen mehr"],"c":3,"n":"","e":"Vollbeschäftigung herrscht, wenn fast jeder, der arbeiten will und kann, eine Stelle findet. In der Praxis gilt das bei einer Arbeitslosenquote unter etwa 2 bis 3 %."},{"q":"Welcher Güterstand gilt bei vertragsloser Ehe?","a":["Die gesetzliche Erbfolge","Die Gütertrennung","Die Gütergemeinschaft","Die Zugewinngemeinschaft","Zugewinntrennung"],"c":3,"n":"","e":"Ohne Ehevertrag leben Ehepaare in der Zugewinngemeinschaft. Jedes Vermögen bleibt getrennt, bei Scheidung wird der in der Ehe erzielte Zugewinn ausgeglichen."},{"q":"Welche Papiere muss der Arbeitnehmer bei der Einstellung dem Arbeitgeber aushändigen?","a":["Geburtsurkunde + Invalidenbescheinigung + Heiratsurkunde","Leumundszeugnis + Personalausweis + Steuerkarte","Sozialversicherungsausweis + Lohnsteuerkarte + Urlaubsbescheinigung","Lohnsteuerjahresausgleich + Lebensversicherungspolice + polizeiliche Führungszeugnis","Lohnsteuerbescheid + Reisepass + Geburtsurkunde"],"c":2,"n":"Die Lohnsteuerkarte gibt es seit 2013 nicht mehr (ELStAM).","e":"Früher brauchte der Arbeitgeber den Sozialversicherungsausweis, die Lohnsteuerkarte und die Urlaubsbescheinigung vom alten Arbeitgeber. Heute gibt man statt der Lohnsteuerkarte die Steuer-ID an."},{"q":"Welche Aussage zur Probezeit bei Auszubildenden ist richtig?","a":["Mindestens 1 Woche, maximal 1 Monat","Mindestens 1 Monat, maximal 4 Monate","Mindestens 3 Monat, maximal 6 Monate","Es gibt keine Probezeit","Die Länge der Probezeit kann sich der Auszubildende aussuchen"],"c":1,"n":"","e":"Die Probezeit in der Ausbildung dauert mindestens einen und höchstens vier Monate (§ 20 BBiG). In dieser Zeit können beide Seiten ohne Frist kündigen."},{"q":"In welchem Zeitraum dürfen schwangere Frauen und Mütter nicht beschäftigt werden?","a":["Während der gesamten Schwangerschaft","4 Wochen vor und 4 Wochen nach der Geburt","6 Wochen vor und 8 Wochen nach der Geburt","Während der Schwangerschaft und 8 Wochen nach der Geburt","Ein Beschäftigungsverbot gilt nur, wenn ein ärztliches Attest vorliegt"],"c":2,"n":"","e":"Die Mutterschutzfrist beginnt 6 Wochen vor der Entbindung und endet 8 Wochen danach (bei Früh- oder Mehrlingsgeburten 12 Wochen). Vor der Geburt darf die Mutter freiwillig weiterarbeiten."},{"q":"Welche Schutzvorschriften gelten für werdende Mütter?","a":["Keine","Eine werdende Mutter darf nicht arbeiten","Eine werdende Mutter darf nur sitzende Tätigkeiten ausüben","Eine werdende Mutter darf keine schweren körperlichen Arbeiten verrichten","Eine werdende Mutter hat keine besonderen Ruhepausen"],"c":3,"n":"","e":"Werdende Mütter dürfen keine schweren körperlichen Arbeiten oder Tätigkeiten mit gefährlichen Stoffen verrichten. Arbeiten dürfen sie aber grundsätzlich weiter."},{"q":"Wer ü
