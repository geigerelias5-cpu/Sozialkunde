berwacht die Einhaltung des Jugendarbeitsschutzgesetzes?","a":["Die Arbeitgeber","Die Gewerkschaft","Der Jugendliche selbst","Die Jugendhilfe","Das Gewerbeaufsichtsamt"],"c":4,"n":"","e":"Die Einhaltung des Jugendarbeitsschutzgesetzes überwacht die staatliche Arbeitsschutzbehörde, also das Gewerbeaufsichtsamt."},{"q":"Wer ist Träger der gesetzlichen Unfallversicherung?","a":["Krankenkasse","Berufsgenossenschaft","Landeserziehungsanstalt","Bundesanstalt für Arbeit","Bundessozialministerium"],"c":1,"n":"","e":"Träger der gesetzlichen Unfallversicherung sind die Berufsgenossenschaften (gewerbliche Wirtschaft) und die Unfallkassen (öffentlicher Dienst)."},{"q":"Wer ist in der Arbeitslosenversicherung pflichtversichert?","a":["Alle Arbeiter und Angestellten","Alle Beamten","Die Selbständigen","Die Rentner","Die Schüler"],"c":0,"n":"","e":"Pflichtversichert in der Arbeitslosenversicherung sind alle Arbeitnehmer und Azubis. Beamte, Selbständige und Rentner sind ausgenommen."},{"q":"Der Frührentner Herr Müller hat Zweifel an der richtigen Berechnung seiner Rente. Vor welchem Gericht muss er klagen?","a":["Jugendgericht","Arbeitsgericht","Sozialgericht","Familiengericht","Schöffengericht"],"c":2,"n":"","e":"Streit mit der Rentenversicherung, etwa über die Rentenhöhe, gehört vor das Sozialgericht. Vorher muss man Widerspruch einlegen."},{"q":"Welche Formvorschrift gilt für den Abschluss des Berufsausbildungsvertrages?","a":["Keine","Berufsausbildungsverträge müssen mündliche abgeschlossen werden","Berufsausbildungsverträge müssen schriftlich abgeschlossen werden","Berufsausbildungsverträge enthalten immer die Unterschrift der Eltern","Es genügt, wenn der Ausbilder den Berufsausbildungsvertrag unterschreibt"],"c":2,"n":"","e":"Der Ausbildungsvertrag muss schriftlich (seit 2020 auch elektronisch) festgehalten werden. Bei Minderjährigen unterschreiben zusätzlich die Eltern."},{"q":"Welche Aussage zur Pflegeversicherung ist richtig?","a":["Nur die Arbeitnehmer zahlen in die Pflegeversicherung ein","Nur die Arbeitgeber zahlen in die Pflegeversicherung ein","Der maximale Beitrag zur Pflegeversicherung für den Arbeitnehmer beträgt 30 € monatlich","Die Krankenkassen sind die Träger der gesetzlichen Pflegeversicherung","Die Pflegeversicherung ist eine freiwillige Versicherung"],"c":3,"n":"","e":"Die Pflegeversicherung ist eine Pflichtversicherung. Träger sind die Pflegekassen, die bei den Krankenkassen angesiedelt sind; die Beiträge zahlen Arbeitnehmer und Arbeitgeber gemeinsam."},{"q":"Warum ist eine ständige berufliche Fortbildung für jeden Arbeitnehmer empfehlenswert?","a":["Berufsinhalte ändern sich, Beitrag zur Sicherung des Arbeitsplatzes","Der Gesetzgeber verpflichtet jeden Arbeitnehmer zur Fortbildung","Das Arbeitsamt verpflichtet jeden zur beruflichen Fortbildung","Im vereinten Europa ist eine individuelle berufliche Fortbildung Pflicht","Berufliche Fortbildung ist nicht notwendig"],"c":0,"n":"","e":"Technik und Arbeitsabläufe ändern sich ständig. Wer sich weiterbildet, bleibt gefragt und sichert so seinen Arbeitsplatz."},{"q":"Wer darf einen Tarifvertrag abschließen?","a":["Die Bundesregierung","Gewerkschaften und Arbeitgeberverbände","Gewerkschaften und Kammern","Die IG-Metall mit dem deutschen Tarifverbund","Jeder Arbeitnehmer mit seinem Arbeitgeber"],"c":1,"n":"","e":"Tarifverträge schließen Gewerkschaften mit Arbeitgeberverbänden ab (Flächentarif) oder mit einzelnen Arbeitgebern (Haustarif)."},{"q":"Welche Arbeitnehmer sind berechtigt den Betriebsrat zu wählen?","a":["Alle ganztags beschäftigten Arbeitnehmer","Alle Arbeitnehmer, die dem Betrieb seit zwei Jahren angehören","Alle Arbeitnehmer des Betriebes","Alle männlichen Arbeitnehmer","Alle Arbeitnehmer, die das 18. Lebensjahr vollendet haben"],"c":4,"n":"Seit 2021 dürfen schon Arbeitnehmer ab 16 Jahren den Betriebsrat wählen. Die Antwort entspricht dem alten Stand.","e":"Nach dem alten Stand war man ab 18 wahlberechtigt. Seit 2021 dürfen alle Arbeitnehmer ab 16 Jahren den Betriebsrat wählen, auch Azubis."},{"q":"Warum gibt es in vielen Betrieben keinen Betriebsrat?","a":["Weil häufig weniger als 5 Mitarbeiter beschäftigt sind","Weil der Chef es nicht erlaubt","Weil es keine Probleme gibt","Weil alle Probleme von der Innung geregelt werden","Weil das in den Tarifverträgen nicht vorgesehen ist"],"c":0,"n":"","e":"Ein Betriebsrat kann erst ab 5 ständig wahlberechtigten Arbeitnehmern gewählt werden. Viele Handwerksbetriebe sind kleiner."},{"q":"Wer ist geschäftsunfähig?","a":["Alle Kinder und Jugendlichen bis zum 18. Lebensjahr","Alle Kinder und Jugendlichen bis zum 14. Lebensjahr","Alle Kinder bis zum 7. Lebensjahr","Alle Kinder bis zum 10. Lebensjahr","Niemand"],"c":2,"n":"","e":"Kinder unter 7 Jahren sind geschäftsunfähig (§ 104 BGB). Ihre Verträge sind nichtig, nur die Eltern können für sie handeln."},{"q":"Wer ist beschränkt strafmündig?","a":["Kinder bis zum 7. Lebensjahr","Jugendliche von 14 bis 18 Jahren","Jugendliche ab dem 18. Lebensjahr","Junge Erwachsene ab dem 21. Lebensjahr","Eine beschränkte Strafmündigkeit gibt es nicht"],"c":1,"n":"","e":"Kinder unter 14 sind strafunmündig. Jugendliche von 14 bis 17 sind bedingt strafmündig und werden nach dem Jugendstrafrecht behandelt."},{"q":"Ab welchem Alter ist man voll deliktfähig, d.h. voll verantwortlich für den Schaden, den man angerichtet hat?","a":["Von Geburt an","Ab dem 7. Lebensjahr","Ab dem 14. Lebensjahr","Ab dem 18. Lebensjahr","Ab dem 21. Lebensjahr"],"c":3,"n":"","e":"Kinder unter 7 haften gar nicht, von 7 bis 17 nur, wenn sie die Einsicht in ihr Unrecht hatten. Ab 18 haftet man voll für Schäden, die man verursacht."},{"q":"Claudia ist 14 Jahre und möchte ihren Freund Axel (19 Jahre) heiraten. Ist das möglich?","a":["Ja","Ja, wenn der gesetzliche Vertreter (z.B. Eltern) zustimmt","Ja, wenn der Freund bereits seine Berufsausbildung abgeschlossen hat","Ja, aber nur wenn Claudia schwanger ist","Nein"],"c":4,"n":"","e":"Seit 2017 darf man in Deutschland erst mit 18 heiraten, ohne Ausnahme. Auch die Eltern können das nicht erlauben."},{"q":"Welche Vorsorgemöglichkeiten hat der Einzelne für Risiken im privaten Bereich?","a":["Einen Kredit aufnehmen","Viele Kinder kriegen","Private Versicherungen abschließen","Umschulungen vermeiden","Beruflichen Aufstieg vermeiden"],"c":2,"n":"","e":"Private Risiken wie Haftung, Unfall oder Berufsunfähigkeit sichert man mit privaten Versicherungen ab."},{"q":"Wie heißt unser derzeitiger Bundespräsident?","a":["Franz Müntefering","Gerhard Schröder","Angela Merkel","Roman Herzog","Horst Köhler"],"c":4,"n":"Diese Frage stammt aus der Original-App (ca. 2008) und ist inzwischen veraltet. Den aktuellen Bundespräsidenten solltest du selbst nachschlagen.","e":"Horst Köhler war Bundespräsident von 2004 bis 2010, als die Original-App entstand. Der Bundespräsident ist das Staatsoberhaupt und wird von der Bundesversammlung für 5 Jahre gewählt."},{"q":"Wie heißt das Wahlrecht für die Wahl zum deutschen Bundestag?","a":["Mehrheitswahlrecht","Verhältniswahlrecht","Personalisiertes Verhältniswahlrecht","Persönlichkeitswahlrecht","Absolutes Persönlichkeitswahlrecht"],"c":2,"n":"","e":"Bei der Bundestagswahl hat man zwei Stimmen: Mit der Erststimme wählt man einen Wahlkreiskandidaten, die Zweitstimme für eine Partei entscheidet über die Sitzverteilung. Das nennt man personalisiertes Verhältniswahlrecht."},{"q":"Welche Partei gibt es nur in Bayern?","a":["SPD","FDP","CDU","CSU","Alle, außer der PDS"],"c":3,"n":"Die PDS gibt es heute nicht mehr in dieser Form.","e":"Die CSU tritt nur in Bayern an. In den anderen Bundesländern tritt ihre Schwesterpartei CDU an, im Bundestag bilden beide eine gemeinsame Fraktion."},{"q":"Welche Hauptaufgabe hat die parlamentarische Opposition?","a":["Kontrolle der Regierung","Unterstützung der Regierung","Gesetzen der Regierung zustimmen","Bundestagssitzungen eröffnen","Leitung des Deutschen Bundestages"],"c":0,"n":"","e":"Die Opposition kontrolliert und kritisiert die Regierung und zeigt Alternativen auf."},{"q":"Wie heißt der derzeitige Bundeskanzler","a":["Gerhard Schröder","Angela Merkel","Horst Köhler","Franz Müntefering","Peer Steinbrück"],"c":1,"n":"Diese Frage stammt aus der Original-App (ca. 2008) und ist inzwischen veraltet. Den aktuellen Bundeskanzler solltest du selbst nachschlagen.","e":"Angela Merkel war Bundeskanzlerin von 2005 bis 2021. Der Bundeskanzler wird vom Bundestag gewählt und bestimmt die Richtlinien der Politik."},{"q":"Wodurch ist die Soziale Marktwirtschaft gekennzeichnet?","a":["Der Staat greift nicht in den Markt ein","Es ist dem Staat verboten eigene Unternehmen zu betreiben","Der Staat plant das gesamt Wirtschaftsgeschehen","Der Staat legt die Preise für Güter und Dienstleistungen fest","Der Staat greift in das Marktgeschehen ein, wenn soziale Ungleichgewichte herrschen"],"c":4,"n":"","e":"In der sozialen Marktwirtschaft herrscht freier Wettbewerb, aber der Staat greift ein, wenn soziale Ungleichheiten entstehen, etwa durch Sozialversicherungen, Kindergeld oder Kündigungsschutz."},{"q":"Welche Leistungen werden nicht vom Bruttosozialprodukt erfasst?","a":["Hausfrauenarbeit und Schwarzarbeit","Hausfrauenarbeit und Arbeit von Auszubildenden","Schwarzarbeit und Arbeit von Auszubildenden","Soziales Engagement und Produktion von Gütern","Ehrenamtliche Tätigkeiten und Berufstätigkeit von Frauen"],"c":0,"n":"","e":"Das Sozialprodukt erfasst nur bezahlte, offiziell gemeldete Leistungen. Hausarbeit ist unbezahlt und Schwarzarbeit wird verheimlicht, beide tauchen deshalb nicht auf."},{"q":"Welche zwei Merkmale beschreibt die Phase der Rezession?","a":["Produktion sinkt, zunehmende Arbeitslosigkeit","Produktion steigt, Preise sinken","Vollbeschäftigung, kaum Investitionen","Produktion steigt, Börsenkurse fallen","Tiefe Börsenkurse, Vollbeschäftigung"],"c":0,"n":"","e":"In der Rezession sinken Produktion und Nachfrage, die Arbeitslosigkeit steigt."},{"q":"Paula zahlt 300 € auf ihr Sparbuch ein. Welche Funktion erfüllt das Geld in diesem Fall?","a":["Tauschmittelfunktion","Wertaufbewahrungsfunktion","Wertübertragungsfunktion","Wertmessung","Kauffunktion"],"c":1,"n":"","e":"Wer Geld spart, bewahrt seinen Wert für später auf. Das ist die Wertaufbewahrungsfunktion des Geldes."},{"q":"Was versteht man unter dem Begriff „Export“?","a":["Verkauf von Waren an das Ausland","Einfuhr von Waren aus dem Ausland","Kauf von Waren aus den USA","Kauf von Rohstoffen aus Asien","Schaffung eines günstigen Investitionsklimas im Inland"],"c":0,"n":"","e":"Export heißt Ausfuhr, also der Verkauf von Waren und Dienstleistungen ins Ausland. Das Gegenteil ist Import."},{"q":"Welches Merkmal kennzeichnet den EU-Binnenmarkt?","a":["EU-Europa ist ohne Grenzen für Waren, Personen, Dienstleistungen und Kapital","Die Zölle zwischen den EU-Mitgliedsländern werden gesenkt","Innerhalb der EU werden Waren nur zu Weltmarktpreisen angeboten","Innerhalb der EU werden nur europäische Waren gehandelt","Innerhalb der EU wird der wirtschaftliche Wettbewerb gehandelt"],"c":0,"n":"","e":"Im EU-Binnenmarkt gelten seit 1993 die vier Freiheiten: freier Verkehr von Waren, Personen, Dienstleistungen und Kapital."},{"q":"Was versteht man unter dem Begriff Recycling?","a":["Die Verbrennung von Müll","Die Vermeidung von Müll","Die Wiederverwertung von Müll","Die Einführung von Umweltgesetzen","Der Kauf von Einwegflaschen"],"c":2,"n":"","e":"Recycling heißt, Abfälle zu sammeln und als Rohstoff wiederzuverwerten, zum Beispiel Altpapier oder Glas."},{"q":"Was versteht man unter dem Begriff Nord-Süd-Gefälle?","a":["Im Norden ist es kalt, im Süden ist es wärmer","Nordeuropäer machen im Süden Urlaub","Industrieländer befinden sich hauptsächlich auf der südlichen Halbkugel","Entwicklungsländer befinden sich hauptsächlich auf der nördlichen Halbkugel","Die reichen Industrieländer liegen größtenteils auf der Nordhalbkugel. Der größte Teil der Entwicklungsländer liegt auf der Südhalbkugel der Erde."],"c":4,"n":"","e":"Die meisten reichen Industrieländer liegen auf der Nordhalbkugel, die meisten Entwicklungsländer im Süden. Diesen Wohlstandsunterschied nennt man Nord-Süd-Gefälle."},{"q":"Welches Ziel verfolgt der Staat mit der Lebensmittelkennzeichnungs-VO?","a":["Der Verbraucher soll umfassend informiert werden","Der Unternehmer soll mehr Arbeit haben","Der Produzent soll Vermarktungsnormen einhalten","Der Verbraucher soll verunsichert werden","Der Verbraucher soll Qualitätsunterschiede nicht merken"],"c":0,"n":"","e":"Die Kennzeichnungspflicht (heute EU-Lebensmittelinformationsverordnung) soll Verbraucher über Zutaten, Allergene, Haltbarkeit und Nährwerte informieren."},{"q":"Welche Ziele haben sich die Vereinten Nationen (UNO) gesetzt?","a":["Einheitliche Zölle, weltweites Wirtschaftswachstum","Bewahrung des Weltfriedens, Durchsetzung der Menschenrechte","Umweltschutz, Friedenserziehung","Verbot des internationalen Waffenhandels, Rüstungskontrolle","Abschaffung unterschiedlicher Ideologien, Machtausweitung"],"c":1,"n":"","e":"Die UNO wurde 1945 gegründet, um den Weltfrieden zu sichern und die Menschenrechte zu fördern."},{"q":"Welche zwei Sonderorganisationen bzw. Hilfsorganisationen gehören zur UNO?","a":["EU, WTO","Amnesty International, NATO","UNICEF, WHO","UNHCR, EWG","WTO, EZB"],"c":2,"n":"","e":"UNICEF (Kinderhilfswerk) und WHO (Weltgesundheitsorganisation) gehören zur UNO. NATO und Amnesty International sind eigenständig, EU und EZB sind europäische Einrichtungen."},{"q":"Was ist die Grundlage einer sinnvollen Entwicklungshilfe, die auf Dauer angelegt ist?","a":["Nahrungsmittel schicken","Hilfe zur Selbsthilfe anbieten","Sinkende Rohstoffpreise anbieten","Waffenlieferungen an Entwicklungsländer fördern","Eine Entschuldung der Entwicklungsländer ablehnen"],"c":1,"n":"","e":"Nachhaltige Entwicklungshilfe soll die Menschen befähigen, sich selbst zu versorgen, zum Beispiel durch Bildung, Brunnen oder Kleinkredite."},{"q":"Welche Leistungen erbringt die gesetzliche Krankenversicherung nicht?","a":["Die Vorsorgeuntersuchungen bei Kindern","Die Vorsorgeuntersuchungen bei Schwangeren","Die Zahlung aller Kosten eines Krankenhausaufenthaltes","Die Erstattung der Arzneimittelkosten bis zum Festbetrag","Es werden nicht die Kosten einer Organtransplantation erstattet"],"c":2,"n":"Korrigiert: Die Krankenkasse übernimmt Arzneimittel bis zum Festbetrag. Nicht übernommen werden alle Kosten eines Krankenhausaufenthalts (es gibt eine Zuzahlung).","e":"Bei einem Krankenhausaufenthalt müssen Erwachsene 10 € pro Tag zuzahlen, höchstens 28 Tage im Jahr. Die Kasse zahlt also nicht alles. Arzneimittel übernimmt sie bis zum Festbetrag."},{"q":"Die 15jährige Monika kauft von ihrem Taschengeld einen Kassetenrekorder und zahlt diese in vier Monatsraten ab. Ist der Kaufvertrag gültig?","a":["Ja","Nein","Ja, aber erst wenn die letzte Rate bezahlt ist","Ja, da Monika beschränkt geschäftsfähig ist","Nein, da Monika noch nicht voll geschäftsfähig ist"],"c":1,"n":"","e":"Mit 15 ist Monika beschränkt geschäftsfähig. Ohne Zustimmung der Eltern ist ein Kauf nur wirksam, wenn sie ihn sofort mit Taschengeld bezahlt (Taschengeldparagraf § 110 BGB). Ratenkäufe fallen nicht darunter."},{"q":"Welche Parteien sind derzeit an der Regierung beteiligt?","a":["CDU und CSU","CDU, CSU und FDP","SPD und FDP","SPD und CDU/CSU","Alle, außer der PDS"],"c":3,"n":"Diese Frage stammt aus der Original-App (ca. 2008) und ist inzwischen veraltet. Die aktuelle Regierungskoalition solltest du selbst nachschlagen.","e":"Bei Entstehung der Original-App regierte eine große Koalition aus CDU/CSU und SPD (2005–2009). Die Regierung wird von den Parteien gebildet, die im Bundestag eine Mehrheit haben."},{"q":"Welche zwei Merkmale beschreiben die Phase der Expansion?","a":["Produktion steigt, Preise steigen","Produktion steigt, Preise sinken","Hohe Arbeitslosigkeit, kaum Investitionen","Produktion sinkt, niedrige Preise","Tiefe Börsenkurse, Produktionstiefstand"],"c":0,"n":"","e":"In der Expansion (Aufschwung) steigen Produktion, Nachfrage und meist auch die Preise. Die Arbeitslosigkeit sinkt."},{"q":"Woran erkennt man Entwicklungsländer?","a":["Großes Bevölkerungswachstum, mangelhafte Ernährung","Hohes Pro-Kopf-Einkommen, ausreichende Ernährung","Analphabetentum, hohe Arbeitsproduktivität","Niedrige Geburtenrate, soziale Sicherung","Technischer Fortschritt, hohes Bildungsniveau"],"c":0,"n":"","e":"Typisch für Entwicklungsländer sind starkes Bevölkerungswachstum, Mangelernährung, niedriges Einkommen und wenig Bildung."},{"q":"In welchem Militärbündnis ist die BRD Mitglied?","a":["UNO","NATO","EU","Warschauer Pakt","In keinem"],"c":1,"n":"","e":"Deutschland ist seit 1955 Mitglied der NATO, des westlichen Verteidigungsbündnisses. Der Warschauer Pakt war das Bündnis des Ostblocks und wurde 1991 aufgelöst."},{"q":"Jedem Ausbildungsverhältnis liegt ein Berufsfeld zugrunde. Was ist darin enthalten?","a":["Fertigkeiten und Kenntnisse, die während der Berufsausbildung vermittelt werden sollen","Bestimmungen über die Höhe der Ausbildungsvergütung","Pläne für den Einsatz der Auszubildenden im Betrieb","Bestimmungen über Arbeitspausen und Urlaub","Unfallverhütungsvorschriften"],"c":0,"n":"","e":"Die Ausbildungsordnung legt fest, welche Fertigkeiten und Kenntnisse in der Ausbildung vermittelt werden müssen. Daraus wird der betriebliche Ausbildungsplan erstellt."},{"q":"Eine Auszubildende hat ihre Ausbildung vor 3 Jahren im April begonnen, kann aber erst im der Sommerprüfung teilnehmen. Wann endet ihr Ausbildungsverhältnis?","a":["Mit Bestehen der praktischen Prüfung","Mit Bestehen der schriftlichen Prüfung","Mit Vertragsende","Am letzten Berufsschultag","An dem Tag, an dem sie die Bestätigung über das Bestehen der Prüfung erhält"],"c":2,"n":"","e":"Die Ausbildung endet mit Ablauf der vereinbarten Zeit. Nur wer die Prüfung vorher besteht, ist schon mit Bekanntgabe des Ergebnisses fertig (§ 21 BBiG)."},{"q":"Welche der folgenden Lohnarten kann von einem Arbeitnehmer abgelehnt werden?","a":["Akkordlohn","Leistungslohn","Lohnfortzahlung in Form von Waren","Prämienlohn","Stücklohn"],"c":2,"n":"","e":"Lohn muss in Euro gezahlt werden. Bezahlung in Waren ist verboten (Truckverbot, § 107 Gewerbeordnung), deshalb kann man sie ablehnen."},{"q":"Welche der folgenden Bestimmungen für die Gewährung von Urlaub ist zutreffend?","a":["Urlaub kann grundsätzlich auch mit Geld abgegolten werden","Urlaub kann gleichmäßig auf alle Monate des Jahres verteilt werden","Jeder Arbeitnehmer kann selbst bestimmen, wann er in Urlaub geht","Der Urlaub mehrerer Jahre kann gesammelt werden und dann als Ganzes genommen werden","Der Urlaub eines Jahres muss möglichst zusammenhängend gewährt werden"],"c":4,"n":"","e":"Laut Bundesurlaubsgesetz ist der Urlaub möglichst zusammenhängend zu gewähren, damit man sich erholt. Auszahlen lassen kann man ihn nur, wenn das Arbeitsverhältnis endet."},{"q":"Innerhalb welcher Frist muss der Arbeitnehmer nach den gesetzlichen Bestimmungen dem Arbeitgeber eine ärztliche Bescheinigung über seine Arbeitsunfähigkeit vorlegen?","a":["Innerhalb einer Woche","Am ersten Tag der Erkrankung","Nach Ablauf der Arbeitsunfähigkeit","Am letzten Tag des Kalendermonats, in dem er erkrankt ist","Spätestens am 3. Kalendertag nach Beginn der Arbeitsunfähigkeit"],"c":4,"n":"","e":"Dauert die Krankheit länger als 3 Kalendertage, braucht man spätestens am darauffolgenden Arbeitstag ein ärztliches Attest (§ 5 EFZG). Seit 2023 schickt die Arztpraxis es elektronisch an die Kasse (eAU), krankmelden muss man sich aber trotzdem sofort."},{"q":"Welches Gericht ist für eine Klage wegen ungerechtfertigter Kündigung zuständig?","a":["Das Amtsgericht","Das Sozialgericht","Das Landgericht","Das Arbeitsgericht","Das Verwaltungsgericht"],"c":3,"n":"","e":"Gegen eine Kündigung klagt man innerhalb von 3 Wochen vor dem Arbeitsgericht (Kündigungsschutzklage)."},{"q":"Eine Auszubildende möchte nach Bestehen der Abschlussprüfung den Betrieb wechseln. Welche Regelung ist dafür vorgesehen?","a":["Sie muss spätestens 3 Monate vor Ende der Berufsausbildung schriftlich kündigen","Es genügt, wenn sie spätestens 1 Monat vor Ende der Berufsausbildung mündlich kündigt","Sie muss nach Bestehen der Abschlussprüfung noch mindestens 1 Monat im Betrieb bleiben","Sie kann erst dann kündigen, wenn der Ausbilder einen Ersatz für sie gefunden hat","Eine Kündigung ist nicht erforderlich, weil das Berufsausbildungsverhältnis mit dem Bestehen der Abschlussprüfung automatisch beendet wird."],"c":4,"n":"","e":"Die Ausbildung endet automatisch mit dem Bestehen der Abschlussprüfung. Eine Kündigung ist nicht nötig, man kann den Betrieb einfach wechseln."},{"q":"Welche der folgenden Steuern belastet alle Bürger in gleicher Höhe?","a":["Lohnsteuer","Mehrwertsteuer","Haus- und Grundsteuer","Vermögenssteuer","KFZ-Steuer"],"c":1,"n":"","e":"Die Mehrwertsteuer ist für alle gleich hoch (19 %, ermäßigt 7 %), egal wie viel jemand verdient. Für Geringverdiener ist sie im Verhältnis zum Einkommen deshalb eine größere Last."},{"q":"Wer ist berechtigt, beim Finanzamt einen Antrag auf Lohnsteuerjahresausgleich zu stellen?","a":["Grundsätzlich jeder Bürger","Alle selbständigen Unternehmer","Jeder, der im vergangenen Jahr weniger als 10000,00 € verdient hat","Jeder Bürger, der im vergangenen Jahr einer Erwerbstätigkeit nachgegangen ist","Jeder, der im vergangenen Jahr mindestens 3 Monate lang gearbeitet hat"],"c":3,"n":"Den „Lohnsteuerjahresausgleich“ beim Finanzamt nennt man heute Einkommensteuererklärung.","e":"Jeder, der im Vorjahr gearbeitet und Lohnsteuer gezahlt hat, kann sich zu viel gezahlte Steuer zurückholen. Heute macht man dafür eine Einkommensteuererklärung (früher Lohnsteuerjahresausgleich)."},{"q":"Von welchem Lohn werden die Beiträge zur Sozialversicherung berechnet?","a":["Vom Bruttolohn","Vom Nettolohn","Vom Lohn nach Abzug der Lohnsteuer","Vom Lohn nach Abzug der Lohn- und Kirchensteuer","Vom Lohn nach Abzug der Kirchensteuer"],"c":0,"n":"","e":"Die Sozialversicherungsbeiträge werden als Prozentsatz vom Bruttolohn berechnet, bis zur jeweiligen Beitragsbemessungsgrenze."},{"q":"Welche der folgenden Leistungen zählen zu den „Werbungskosten“ im Sinne des Lohnsteuerjahresausgleich?","a":["Beiträge zu den Sozialversicherungen","Kosten für die Fahrt zur Arbeit","Kosten für Werbeplakate des Betriebs","Spenden für wohltätige Zwecke","Kosten für den Erholungsurlaub"],"c":1,"n":"Heute heißt das Einkommensteuererklärung statt Lohnsteuerjahresausgleich.","e":"Werbungskosten sind Ausgaben für den Beruf, zum Beispiel die Fahrt zur Arbeit (Entfernungspauschale), Arbeitskleidung oder Fachbücher. Sie senken die Steuer."},{"q":"Welche der folgenden wirtschaftspolitischen Maßnahmen des Staates fördert die Nachfrage der Verbraucher nach Gütern und Dienstleistungen?","a":["Senkung der Lohn- und Einkommenssteuer","Erhöhung der Lohn- und Einkommenssteuer","Förderung des Warenexports","Erhöhung der Mehrwertsteuer","Erhöhung der Sozialversicherungsbeiträge"],"c":0,"n":"","e":"Sinken Lohn- und Einkommensteuer, bleibt den Menschen mehr Netto übrig. Sie können mehr kaufen, die Nachfrage steigt."},{"q":"Das Vermögen einer Person ist gefährdet, wenn Schadensersatzansprüche an sie gestellt werden können. Welche der folgenden Versicherungen sollte man vorsorglich für alle Fälle abschließen?","a":["Eine Lebensversicherung","Eine Hausratversicherung","Eine private Unfallversicherung","Eine Rechtschutzversicherung","Eine Haftpflichtversicherung"],"c":4,"n":"","e":"Die private Haftpflichtversicherung zahlt, wenn man anderen versehentlich einen Schaden zufügt. Weil man dafür mit dem ganzen Vermögen haftet, gilt sie als wichtigste private Versicherung."},{"q":"Was bedeutet der Begriff „Solidarität“?","a":["Unabhängigkeit eines Staates","Das Zusammengehörigkeitsgefühl","Die Unabhängigkeit des Menschen","Eine gute handwerkliche Leistung","Die Gesellschaftslehre"],"c":1,"n":"","e":"Solidarität heißt Zusammengehörigkeit und gegenseitige Hilfe: Die Starken stehen für die Schwachen ein. Darauf beruhen auch die Sozialversicherungen."},{"q":"Welcher der folgenden Staaten gehört nicht der EU an?","a":["Österreich","Italien","England","Schweiz","Dänemark"],"c":3,"n":"","e":"Die Schweiz ist kein EU-Mitglied, sie ist durch Verträge eng mit der EU verbunden. Österreich, Italien und Dänemark gehören zur EU. Das Vereinigte Königreich (England) ist 2020 ausgetreten."},{"q":"Die EU hat sich viele Ziele gesteckt. Welches der folgenden Ziele gehört nicht dazu?","a":["Die Strukturförderung der ärmeren Mitgliedsländer zur Hebung des Lebensstandards","Eine gemeinsame Außenpolitik gegenüber nichteuropäischen Staaten","Eine gemeinsame zentrale Regierung","Die Einführung einer gemeinsamen Währung","Eine gemeinsame Sicherheitspolitik zur Bekämpfung der internationalen Kriminalität"],"c":2,"n":"","e":"Die EU hat keine gemeinsame Zentralregierung. Die Mitgliedstaaten bleiben souverän und arbeiten in gemeinsamen Organen wie Kommission, Rat und Parlament zusammen."},{"q":"Die EU-Kommission drängt darauf, dass die Mitgliedsstaaten ihre „Subventionen“ abbauen. Was versteht man unter diesem Begriff?","a":["Den Gewinnverzicht privater Unternehmer","Das Festhalten an Steuern","Die nationale Wirtschaftspolitik eines Staates","Schutzzölle bei der Einfuhr von Waren","Eine Finanzhilfe des Staates zur Erhaltung der Konkurrenzfähigkeit von Betrieben"],"c":4,"n":"","e":"Subventionen sind finanzielle Hilfen des Staates an Unternehmen oder Branchen. Die EU will sie begrenzen, weil sie den Wettbewerb verzerren."},{"q":"Wie oft darf die Abschlussprüfung wiederholt werden?","a":["Einmal","Zweimal","Dreimal","Beliebig oft","Überhaupt nicht"],"c":1,"n":"","e":"Die Abschluss- bzw. Gesellenprüfung kann man zweimal wiederholen (§ 37 BBiG), insgesamt hat man also drei Versuche."},{"q":"Für welchen Personenkreis gilt das Jugendarbeitsschutzgesetz?","a":["Für alle Auszubildenden","Für weibliche Arbeitnehmer","Für alle Arbeitnehmer","Für Beschäftigte unter 18 Jahren","Für Beschäftigte bis 21 Jahre"],"c":3,"n":"","e":"Das Jugendarbeitsschutzgesetz gilt für alle Beschäftigten unter 18 Jahren, egal ob in Ausbildung oder im Job."},{"q":"In welchem Gesetz stehen Pflichten und Rechte des Auszubildenden und des Ausbildenden?","a":["Berufsbildungsgesetz","Betriebsverfassungsgesetz","Jugendarbeitsschutzgesetz","Bürgerlichem Gesetzbuch","Grundgesetz"],"c":0,"n":"","e":"Das Berufsbildungsgesetz (BBiG) regelt die Rechte und Pflichten von Auszubildenden und Ausbildenden, zum Beispiel Vergütung, Probezeit und Kündigung."},{"q":"Ehemündig ist man (Frau/Mann) in der Regel","a":["Mann und Frau mit 16 Jahren","Mit 18 Jahren","Die Frau mit 18, der Mann mit 21","Die Frau mit 16, der Mann mit 18","Mit 21 Jahren"],"c":1,"n":"","e":"Seit 2017 ist man in Deutschland erst mit 18 ehemündig. Ausnahmen für 16-Jährige gibt es nicht mehr."},{"q":"In welchem Gesetz sind die Grundrechte des Menschen zu finden?","a":["Berufsausbildungsgesetz","Bürgerlichem Gesetzbuch","Grundgesetz","Straßenverkehrsordnung","Bundesverfassungsgesetz"],"c":2,"n":"","e":"Die Grundrechte stehen in den Artikeln 1 bis 19 des Grundgesetzes, zum Beispiel Menschenwürde, Gleichheit und Meinungsfreiheit."},{"q":"Wie viele Urlaubstage stehen Ihnen als 19-jährige Gesellin laut Bundesurlaubsgesetz mindestens zu?","a":["16 Werktage","20 Werktage","24 Werktage","26 Werktage","30 Werktage"],"c":2,"n":"","e":"Laut Bundesurlaubsgesetz stehen jedem Arbeitnehmer mindestens 24 Werktage zu, gerechnet mit Samstag; bei einer 5-Tage-Woche sind das 20 Arbeitstage. Jugendliche bekommen mehr, viele Tarifverträge auch."},{"q":"Was ist die Aufgabe der Presse in einem Rechtsstaat?","a":["Die Bürger zu informieren","Die Leser zu unterhalten","Straftaten aufzuklären","Die Regierung zu kontrollieren","Die Meinung der Regierung zu verbreiten"],"c":0,"n":"","e":"Die Presse soll die Bürger informieren, damit sie sich eine Meinung bilden können. Damit kontrolliert sie auch die Mächtigen, deshalb heißt sie „vierte Gewalt“."},{"q":"Welches Gesetz beinhaltet das Recht auf freie Berufswahl und freie Wahl des Arbeitsplatzes?","a":["Das Berufsbildungsgesetz","Das Grundgesetz","Das Jugendarbeitsschutzgesetz","Das bürgerliche Gesetzbuch","Die Bayerische Verfassung"],"c":1,"n":"","e":"Das Recht auf freie Wahl von Beruf, Arbeitsplatz und Ausbildungsstätte steht in Artikel 12 des Grundgesetzes."},{"q":"Wer ist der Begründer der Sozialgesetzgebung?","a":["Helmut Kohl","Otto von Bismarck","Ludwig Erhard","Willy Brandt","Konrad Adenauer"],"c":1,"n":"","e":"Reichskanzler Otto von Bismarck führte in den 1880er-Jahren die Kranken-, Unfall- und Rentenversicherung ein. Das war der Grundstein des deutschen Sozialstaats."},{"q":"Wann spricht man von Rezession?","a":["Wenn sich das Wirtschaftswachstum abschwächt","Wenn die Preise stark steigen","Wenn Vollbeschäftigung herrscht","Wenn Hochkonjunktur herrscht","Wenn die Löhne steigen"],"c":0,"n":"","e":"Eine Rezession beginnt, wenn das Wachstum nachlässt und die Wirtschaft schrumpft. Als Faustregel gilt: zwei Quartale hintereinander mit sinkendem BIP."},{"q":"Welches Organ vertritt die 16 Bundesländer auf Bundesebene?","a":["Bundesgerichtshof","Bundesrat","Bundestag","Bundeskartellamt","Bundeswehr"],"c":1,"n":"","e":"Im Bundesrat sitzen Vertreter der 16 Landesregierungen. Über ihn wirken die Länder an der Gesetzgebung des Bundes mit."},{"q":"Was bedeutet der Ausdruck „Repräsentative Demokratie“?","a":["Alle Menschen sind vor dem Gesetz gleich","Bürger wählen Volksvertreter ins Parlament","Soziale Sicherung durch den Staat","Gewaltenteilung","Rechtssicherheit (keine Strafe ohne Gesetz)"],"c":1,"n":"","e":"In der repräsentativen Demokratie entscheidet das Volk nicht selbst über jedes Gesetz. Es wählt Abgeordnete, die es im Parlament vertreten."},{"q":"Ab welchem Alter ist man in der BRD wahlberechtigt?","a":["Ab dem vollendeten 16. Lebensjahr","Ab dem vollendeten 17. Lebensjahr","Ab dem vollendeten 18. Lebensjahr","Ab dem vollendeten 21. Lebensjahr","Ab dem vollendeten 23. Lebensjahr"],"c":2,"n":"","e":"Für die Bundestagswahl ist man ab 18 Jahren wahlberechtigt. Bei der Europawahl und in manchen Bundesländern bei Kommunal- oder Landtagswahlen schon ab 16."},{"q":"Kann ein Vertrag, der in der eigenen Wohnung zustande gekommen ist widerrufen werden?","a":["Nein, grundsätzlich nicht","Ja, dies muss jedoch innerhalb von zwei Wochen geschehen","Ja, solche Verträge sind grundsätzlich ungültig","Ja, dies muss jedoch innerhalb von einer Woche geschehen","Ja, dies muss jedoch innerhalb eines Monats geschehen"],"c":1,"n":"Korrigiert: Heute beträgt die Widerrufsfrist 14 Tage. Die Original-App hatte noch eine Woche.","e":"Verträge, die außerhalb von Geschäftsräumen geschlossen werden, etwa an der Haustür, kann man innerhalb von 14 Tagen ohne Begründung widerrufen."},{"q":"Was versteht man unter Diplomatie?","a":["Das Pflegen von friedlichen internationalen Beziehungen","Die Verletzung von Menschenrechten","Die staatliche Unterstützung von Arbeitslosen","Die Bekämpfung der Industriespionage","Die Einschränkung von internationalen Beziehungen"],"c":0,"n":"","e":"Diplomatie ist die Kunst, Beziehungen zwischen Staaten friedlich durch Verhandlungen zu pflegen. Dafür gibt es Botschafter."},{"q":"Welche Aufgabe hat die Handwerkskammer unter anderem?","a":["Abschluss der Tarifverträge mit den Gewerkschaften","Überwachung der ordnungsgemäßen Buchführung ihrer Mitglieder","Abnahme der Zwischen- und Gesellenprüfungen","Überwachung der Einhaltung der Unfallvorschriften","Entscheidung von Streitigkeiten, die sich aus Arbeitsverträgen ergeben"],"c":2,"n":"","e":"Die Handwerkskammer führt die Handwerksrolle und das Lehrlingsverzeichnis und nimmt Zwischen-, Gesellen- und Meisterprüfungen ab."},{"q":"Welche Personen genießen besonderen Kündigungsschutz?","a":["Langjährige Betriebsangehörige und leitende Angestellte","Teilzeitbeschäftigte und Schwangere","Leitende Angestellte und Wehrdienstleistende","Wehrdienstleistende und Schwangere","Leitende Angestellte und Schwerbehinderte"],"c":3,"n":"Die Wehrpflicht ist seit 2011 ausgesetzt. Schwangere haben weiterhin besonderen Kündigungsschutz.","e":"Schwangere und Mütter bis 4 Monate nach der Geburt sind fast unkündbar (Mutterschutzgesetz). Wehrdienstleistende waren nach dem Arbeitsplatzschutzgesetz geschützt; die Wehrpflicht ist seit 2011 ausgesetzt, für freiwillig Dienende gilt der Schutz weiter."},{"q":"Die Aufgabe der Jugendvertretung im Betrieb ist u.a.","a":["Darauf zu achten, dass die Gesetze, die die jugendlichen Arbeitnehmer betreffen, eingehalten werden","Die Ausbildung zu überwachen","Die Ausbildung durchzuführen","Bei der Neueinstellung von Jugendlichen mitzuwirken","Beim Kauf neuer Maschinen mitzubestimmen"],"c":0,"n":"","e":"Die Jugend- und Auszubildendenvertretung (JAV) achtet darauf, dass Gesetze, Tarifverträge und Regeln zugunsten junger Beschäftigter eingehalten werden. Sie arbeitet mit dem Betriebsrat zusammen."},{"q":"Der Betriebsrat hat in bestimmten Angelegenheiten ein Mitbestimmungsrecht, das heißt:","a":["Die Betriebsführung muss den Betriebsrat nach seiner Meinung fragen","Die Betriebsführung muss den Betriebsrat um seine Zustimmung bitten","Der Betriebsrat darf sich bei den Diskussionen zu Wort melden","Der Betriebsrat muss die Arbeiter um Zustimmung für sein Verhalten bitten","Die Arbeiter müssen bei den Betriebsratswahlen ihre Stimme abgeben"],"c":1,"n":"","e":"Mitbestimmung heißt: Der Arbeitgeber braucht die Zustimmung des Betriebsrats. Ohne sie darf er die Maßnahme nicht durchführen, im Streitfall entscheidet die Einigungsstelle."},{"q":"In welchen Bereichen hat der Betriebsrat ein zwingendes Mitbestimmungsrecht?","a":["Bei schwerwiegenden Änderungen im Betrieb (z.B. Konkurs, Erweiterungen)","In sozialen Angelegenheiten (z.B. Unfallverhütung, Urlaubsplan)","In wirtschaftlichen Angelegenheiten ( z.B. Produktion, Investition)","Bei der Gestaltung des Arbeitsplatzes (z.B. Umbau, Arbeitsverfahren)","Bei betrieblichen Bildungsmaßnahmen (z.B. Weiterbildung)"],"c":1,"n":"","e":"Volle Mitbestimmung hat der Betriebsrat vor allem in sozialen Angelegenheiten (§ 87 BetrVG), etwa Arbeitszeit, Urlaubsplan und Unfallschutz. In wirtschaftlichen Fragen wird er nur informiert."},{"q":"Welche Maßnahme der Europäischen Zentralbank ist bei Hochkonjunktur sinnvoll?","a":["Erhöhung der Zinsen","Senkung der Mindestreserven","Senkung der Zinsen","Abwertung des Euros","Vergabe von Bauaufträgen"],"c":0,"n":"","e":"In der Hochkonjunktur droht Inflation. Höhere Zinsen verteuern Kredite und dämpfen die Nachfrage, so wird die Wirtschaft abgekühlt."},{"q":"Wie lässt sich eine Situation der Wirtschaft am Tiefstand beschreiben?","a":["Hohe Arbeitslosigkeit, viele Neugründungen von Betrieben","Stark steigende Löhne, viele Konkurse","Hohe Arbeitslosigkeit, sinkende Löhne","Vollbeschäftigung, stark steigende Preise","Vollbeschäftigung, viele Neugründungen von Betrieben"],"c":2,"n":"","e":"Am konjunkturellen Tiefpunkt (Depression) sind Produktion und Nachfrage niedrig, die Arbeitslosigkeit ist hoch, und die Löhne steigen kaum oder sinken."},{"q":"Welche Auswirkung hat die Aufwertung des Euro auf die deutsche Wirtschaft?","a":["Es werden mehr Waren importiert","Auslandsreisen werden teurer, dadurch wird die deutsche Tourismusindustrie gefördert","Rohstoffe, die eingeführt werden (z.B. Rohöl) werden teurer","Die deutschen Waren werden im Ausland billiger, dadurch kann mehr exportiert werden","In Deutschland werden die Preise allgemein steigen, dadurch geht es der Wirtschaft besser"],"c":0,"n":"","e":"Wird der Euro mehr wert, sind ausländische Waren für uns billiger, deshalb wird mehr importiert. Deutsche Waren werden im Ausland teurer, der Export leidet."},{"q":"Wie wirkt es sich auf die Wirtschaft aus, wenn sehr viele Bürger ihr Geld sparen?","a":["Die Banken werden ihre Sparzinsen anheben","Viele Geschäfte werden ihre Preise anheben, weil die Bürger jetzt mehr Geld haben um sich neue Waren zu kaufen","Es gibt weniger Arbeitslose","Es werden neue Unternehmen gegründet","Die Wirtschaft wird gebremst, weil zu wenig verkauft wird"],"c":4,"n":"","e":"Wenn alle sparen, wird weniger gekauft. Die Unternehmen verkaufen weniger und produzieren weniger, die Wirtschaft wird gebremst."},{"q":"Am Ende jeden Monats bzw. Jahres wird bekannt gegeben, wie stark die Preise im vergangenen Monat gestiegen sind. Wie wird diese Preissteigerungsrate bestimmt?","a":["Eine bestimmt Zahl von Bürgern wird befragt, wie viel sie im vergangenen Monat ausgegeben haben","Man fragt in den wichtigsten Geschäften nach, um wie viel Prozent die Verkaufspreise gestiegen sind","Der Bundestag beschließt jeden Monat um wie viel Prozent die Preise steigen dürfen","Mit Hilfe des „Warenkorbes“ werden die Kosten für die Lebenshaltung bestimmt","Man vergleicht den Wert der € gegenüber dem Dollar"],"c":3,"n":"","e":"Das Statistische Bundesamt beobachtet die Preise eines „Warenkorbs“ aus rund 650 typischen Gütern und Dienstleistungen. Wie viel teurer dieser Korb wird, ist die Inflationsrate."},{"q":"Seit 1993 gilt die wirtschaftliche Freizügigkeit für alle Bürger der EU Staaten. Was bedeutet das?","a":["Jeder Bürger der EU darf in jedem Staat der Welt wohnen und arbeiten","Der Bahnverkehr innerhalb der EU wurde wesentlich vereinfacht","Jeder Bürger der EU darf in jedem Staat der EU wohnen und arbeiten","Die strengen Sittenregeln einiger EU Staaten wurden aufgehoben","Die Bürger der EU dürfen normalerweise nur in ihrem Heimatland arbeiten"],"c":2,"n":"","e":"Arbeitnehmerfreizügigkeit heißt, dass jeder EU-Bürger in jedem EU-Land wohnen und arbeiten darf, ohne Arbeitserlaubnis."},{"q":"Wer entscheidet bei Streitigkeiten aus einem Arbeitsverhältnis in letzter Instanz?","a":["Handwerkskammer","Betriebsrat","Bundesarbeitsgericht","Sozialgericht","Amtsgericht"],"c":2,"n":"","e":"Die Arbeitsgerichtsbarkeit hat drei Stufen: Arbeitsgericht, Landesarbeitsgericht und als letzte Instanz das Bundesarbeitsgericht in Erfurt."},{"q":"Welches Gericht entscheidet bei Streitigkeiten mit Sozialversicherungsträgern?","a":["Arbeitsgericht","Amtsgericht","Sozialgericht","Verwaltungsgericht","Zivilgericht"],"c":2,"n":"","e":"Für Streit mit Kranken-, Renten-, Unfall-, Pflege- und Arbeitslosenversicherung ist das Sozialgericht zuständig."},{"q":"Wer muss für den Unterhalt einer Familie sorgen?","a":["Ehemann allein","Der am meisten verdient","Ehefrau allein","Verwandtschaft muss mithelfen","Ehemann und Ehefrau"],"c":4,"n":"","e":"Beide Ehepartner sind gleichermaßen verpflichtet, die Familie zu unterhalten, durch Erwerbsarbeit oder durch Haushaltsführung (§ 1360 BGB)."},{"q":"Ein Arbeitnehmer wird zu Recht fristlos entlassen. Welche Aussage trifft dann zu?","a":["Er erhält sofort Arbeitslosengeld","Er verliert den Anspruch auf Arbeitslosengeld","Er erhält Arbeitslosengeld erst nach einer Sperrfrist","Er erhält sofort Arbeitslosenhilfe","Er verliert den Anspruch auf Sozialhilfe"],"c":2,"n":"Korrigiert: Bei selbst verschuldeter Kündigung gibt es eine Sperrzeit (meist 12 Wochen). Die Original-App hatte „sofort“ als richtig.","e":"Wer seine Kündigung selbst verschuldet hat, bekommt eine Sperrzeit von meist 12 Wochen. Erst danach gibt es Arbeitslosengeld, und der Anspruch wird insgesamt kürzer."},{"q":"Wie wird der Begriff „Sozialabgaben“ richtig erklärt?","a":["Beiträge zu Lebensversicherungen","Pflichtbeiträge zu Renten-, Kranken-, Pflege- und Arbeitslosenversicherung der Arbeitnehmer","Spenden für Flüchtlinge, Katastrophengeschädigte und Kriegsopfer","Beiträge zur Einrichtung von Kantinen, Kindergärten und Werkswohnungen für die Beschäftigten der Betriebe","Übertragung erworbener Sozialversicherungsansprüche auf den Ehepartner durch Gerichtsurteil"],"c":1,"n":"","e":"Sozialabgaben sind die Pflichtbeiträge zur Renten-, Kranken-, Pflege- und Arbeitslosenversicherung. Sie werden direkt vom Bruttolohn abgezogen."},{"q":"In welchen Konjunkturphasen sind höhere Lohnforderungen wirtschaftlich bedenklich?","a":["Expansion, Depression","Hochkonjunktur, Depression","Rezession, Expansion","Depression, Rezession","Inflation, Depression"],"c":3,"n":"","e":"Im Abschwung und am Tiefpunkt verdienen die Unternehmen schlecht. Hohe Lohnforderungen könnten dann zu weiteren Entlassungen führen."},{"q":"Für wen bringt die Inflation die meisten Nachteile?","a":["Für den Kreditnehmer","Für den Sparer","Für Bund und Länder","Für Gutsbesitzer","Für Vermieter"],"c":1,"n":"","e":"Inflation entwertet Erspartes: Die Zinsen gleichen den Kaufkraftverlust oft nicht aus. Kreditnehmer profitieren dagegen, weil ihre Schulden real weniger wert werden."},{"q":"Welche der folgenden Steuern behält der Arbeitgeber vom Arbeitsentgelt seiner Arbeitnehmer und führt sie ans Finanzamt ab?","a":["Lohnsteuer","Mehrwertsteuer","Vermögenssteuer","Körperschaftssteuer","Gewerbesteuer"],"c":0,"n":"","e":"Der Arbeitgeber behält die Lohnsteuer (mit Soli und Kirchensteuer) vom Bruttolohn ein und überweist sie ans Finanzamt."},{"q":"Welche Maßnahme verstößt gegen die Wirtschaftsordnung der Sozialen Marktwirtschaft?","a":["Preisbildung wird durch Angebot und Nachfrage bestimmt","Staat unterstützt wirtschaftlich gefährdete Betriebe","Ladenöffnungszeiten sind durch Gesetz geregelt","Staat schreibt Betrieben Menge und Art der Produktion vor","Staat ist Eigentümer einiger großer Betriebe (z.B. Bahn)"],"c":3,"n":"","e":"Wenn der Staat Menge und Art der Produktion vorschreibt, ist das Planwirtschaft. In der sozialen Marktwirtschaft entscheiden die Unternehmen das selbst."},{"q":"Wer vertritt bei Tarifverhandlungen im Handwerk die Interessen der Arbeitgeber?","a":["Der jeweilige Landesinnungsverband","Die Handwerkskammer","Die Berufsgenossenschaft","Der Betriebsrat","Die jeweilige Gewerkschaft"],"c":0,"n":"","e":"Im Handwerk verhandelt der Landesinnungsverband als Arbeitgebervertreter mit der Gewerkschaft über Tarifverträge."},{"q":"Wer wird in erster Linie geschädigt, wenn man Leistungen der gesetzlichen Krankenkasse ungerechtfertigt in Anspruch nimmt?","a":["Der Staat","Die Verwaltung der Krankenkasse","Die Beitrag zahlenden Mitglieder","Niemand wird geschädigt","Die Bundesregierung"],"c":2,"n":"","e":"Die Krankenkasse zahlt alles aus den Beiträgen ihrer Mitglieder. Wer unberechtigt Leistungen nimmt, treibt die Kosten und damit die Beiträge für alle in die Höhe."},{"q":"Wonach richtet sich die Höhe des Monatsbeitrages zur Krankenkasse für Pflichtversicherte?","a":["Nach der gesundheitlichen Gefährdung, der der Versicherte durch seine Arbeit ausgesetzt ist","Nach dem Alter und dem Gesundheitszustand des Versicherten","Nach dem durchschnittlichen Verdienst aller Versicherten","Nach der Höhe des monatlichen Bruttogehaltes des Versicherten","Nach der Anzahl der mitversicherten Familienmitglieder"],"c":3,"n":"","e":"Der Beitrag ist ein Prozentsatz vom Bruttoeinkommen bis zur Beitragsbemessungsgrenze. Alter oder Gesundheit spielen in der gesetzlichen Krankenversicherung keine Rolle."},{"q":"Wie viele Gewerkschaftsmitglieder müssen bei einer Urabstimmung einem Streik zustimmen?","a":["Ein Viertel","Ein Drittel","Die Hälfte","75 Prozent","Alle"],"c":3,"n":"","e":"Nach den Satzungen der meisten Gewerkschaften müssen mindestens 75 % der abstimmenden Mitglieder für einen Streik stimmen."},{"q":"Ein Arbeitnehmer wird auf dem direkten Weg zu seinem Arbeitsplatz, den er mit seinem Auto zurücklegt, durch eigene Unachtsamkeit schwer verletzt. Welche Aussage ist richtig?","a":["Dieser Wegeunfall ist durch die gesetzliche Unfallversicherung nicht abgedeckt","Es liegt ein Wegeunfall vor. Der Betrieb muss den Unfall der Berufsgenossenschaft melden","Der Arbeitnehmer genießt nicht den Schutz der Unfallversicherung, da er den Unfall selbst verschuldet hat","Unfälle mit eigenen Auto sind im Gegensatz zu Unfällen mit öffentlichen Verkehrsmitteln nicht als Wegeunfälle meldepflichtig","Gesetzlicher Vormund muss zahlen"],"c":1,"n":"","e":"Der direkte Weg zur Arbeit ist versichert, auch wenn man den Unfall selbst verschuldet hat. Der Arbeitgeber meldet den Wegeunfall der Berufsgenossenschaft."},{"q":"Welche Stelle tritt ein, wenn der Arbeitgeber gegen das Jugendarbeitsschutzgesetz verstößt und der Auszubildende bzw. dessen Erziehungsberechtigte dagegen Klage erhebt?","a":["Das Arbeitsgericht","Das Arbeitsamt","Das Gewerbeaufsichtsamt","Die Krankenkasse","Das Jugendamt"],"c":0,"n":"","e":"Streit aus dem Ausbildungs- oder Arbeitsverhältnis klärt das Arbeitsgericht. Verstöße gegen das Jugendarbeitsschutzgesetz verfolgt zusätzlich das Gewerbeaufsichtsamt."},{"q":"Welche der folgenden Institutionen ist verantwortlich für die Geldpolitik?","a":["Der Deutsche Sparkassen- und Giroverband","Bundesminister für Finanzen","Bundesminister für Wirtschaft","Europäische Zentralbank","Die Bundesregierung"],"c":3,"n":"","e":"Für die Geldpolitik im Euroraum ist die Europäische Zentralbank verantwortlich. Sie ist unabhängig von den Regierungen."},{"q":"Welcher der genannten Rechtsbegriffe nimmt den höchsten Rang ein?","a":["Verordnung","Gesetz","Satzung","Verfassung","Richtlinie"],"c":3,"n":"","e":"Die Verfassung (bei uns das Grundgesetz) steht ganz oben. Gesetze, Verordnungen und Satzungen dürfen ihr nicht widersprechen."},{"q":"Wer zahlt die Beiträge zur gesetzlichen Pflege-, Arbeitslosen- und Rentenversicherung?","a":["50% Arbeitnehmer/50% Arbeitgeber","100% Arbeitgeber","100% Arbeitnehmer","2/3 Arbeitnehmer und 1/3 Arbeitgeber","1/3 Arbeitnehmer und 2/3 Arbeitgeber"],"c":0,"n":"","e":"Renten-, Arbeitslosen- und Pflegeversicherung teilen sich Arbeitnehmer und Arbeitgeber je zur Hälfte. Ausnahmen: Den Pflege-Zuschlag für Kinderlose zahlt der Arbeitnehmer allein, und in Sachsen ist die Pflege anders aufgeteilt."},{"q":"Welche Aufgaben haben die Gewerkschaften?","a":["Vertretung der Arbeitgeberinteressen","Vertretung der Arbeitnehmerinteressen","Sie handeln nur den Lohn aus","Sie bilden den Betriebsrat","Sie überwachen die Ausbildung"],"c":1,"n":"","e":"Gewerkschaften vertreten die Interessen der Arbeitnehmer, zum Beispiel bei Tarifverhandlungen über Lohn und Arbeitszeit. Sie beraten ihre Mitglieder und helfen vor Gericht."},{"q":"Was versteht man unter Rechtsfähigkeit?","a":["Die Fähigkeit, Rechtsgeschäfte selbständig abschließen zu können","Die Fähigkeit, für strafbare Handlungen verantwortlich gemacht werden zu können","Die Fähigkeit, Recht von Unrecht unterscheiden zu können","Die Fähigkeit, Träger von Rechten und Pflichten zu sein","Das Recht, ab 18 Jahren Rechtsgeschäfts voll gültig abschließen zu können"],"c":3,"n":"","e":"Rechtsfähigkeit ist die Fähigkeit, Träger von Rechten und Pflichten zu sein. Sie beginnt mit der Geburt. Verträge abschließen zu können heißt dagegen Geschäftsfähigkeit."},{"q":"Wo findet die Preisbildung in einer Marktwirtschaft statt?","a":["Im Privathaushalt","In jedem einzelnen Unternehmen","Bei den Unternehmerverbänden","Auf dem Markt, wo sich Angebot und Nachfrage treffen","Den Preis bestimmt die Regierung"],"c":3,"n":"","e":"Der Preis bildet sich auf dem Markt, wo Angebot und Nachfrage aufeinandertreffen."},{"q":"Was gehört nicht zu den Lohnnebenkosten, die der Arbeitgeber aufbringen muss?","a":["Beiträge zur gesetzlichen Unfallversicherung","Lohnsteuer","Beiträge zur gesetzlichen Krankenversicherung","Arbeitgeberanteil zur Rentenversicherung","Beiträge zur gesetzlichen Pflegeversicherung"],"c":1,"n":"","e":"Lohnnebenkosten sind die Arbeitgeberanteile zur Sozialversicherung und andere Zusatzkosten. Die Lohnsteuer zahlt der Arbeitnehmer aus seinem Bruttolohn, der Arbeitgeber führt sie nur ab."},{"q":"Welche Maßnahmen dienen zur Ankurbelung der Konjunktur?","a":["Erhöhung der Mineralölsteuer und Lohnsteuer","Erhöhung der Mindestreserven","Höhere Sozialabgaben und höhere Mehrwertsteuer","Senkung der Leitzinsen und Senkung der Mindestreserven","Erhöhung des Basiszinssatzes, da die Bevölkerung mehr Zinsen für ihr Erspartes erhalten"],"c":3,"n":"","e":"Senkt die Zentralbank Leitzinsen und Mindestreserve, haben die Banken mehr Geld und können günstiger Kredite vergeben. Das regt Investitionen und Konsum an."},{"q":"Wie heißen bei Tarifkonflikten die jeweiligen Kampfmaßnahmen der Gewerkschaften und Arbeitgeberverbände?","a":["Warnstreik und Schlichtung","Aussperrung und Lohnkürzung","Streik und Lohnstopp","Streik und Aussperrung","Schlichtung und Aussperrung"],"c":3,"n":"","e":"Das Kampfmittel der Gewerkschaften ist der Streik, das der Arbeitgeber die Aussperrung."},{"q":"Welche Aufgabe hat die Handwerkskammer?","a":["Interessenvertretung des gesamten Handwerks","Führung des Handelsregisters","Abschluss von Tarifverträgen","Verknüpfung von Handwerk und Industrie","Überwachung des Jugendarbeitsschutzgesetzes"],"c":0,"n":"","e":"Die Handwerkskammer ist die Selbstverwaltung des gesamten Handwerks in einer Region und vertritt dessen Interessen. Jeder Handwerksbetrieb ist Pflichtmitglied."},{"q":"Welches Merkmal trifft nicht auf die Soziale Marktwirtschaft zu?","a":["Tarifautonomie der Sozialpartner","Besitz von Eigentum","Kontrolle der Preise für Grundnahrungsmittel","Aufbau eines Systems der sozialen Sicherheit","Sozial Schwächere werden durch den Staat unterstützt"],"c":2,"n":"","e":"Staatliche Preiskontrollen widersprechen der freien Preisbildung am Markt. Tarifautonomie, Privateigentum und soziale Sicherung gehören dagegen zur sozialen Marktwirtschaft."},{"q":"Wie muss ein Berufsausbildungsverhältnis nach Ablauf der Probezeit gekündigt werden?","a":["Schriftlich ohne Angaben der Kündigungsgründe","Schriftlich mit Genehmigung der Handwerkskammer","Schriftlich mit Angabe der Kündigungsgründe","Mündlich ohne Angabe der Kündigungsgründe","Mündlich mit Angabe der Kündigungsgründe und Genehmigung durch die Handwerkskammer"],"c":2,"n":"","e":"Nach der Probezeit muss die Kündigung schriftlich erfolgen. Kündigt der Betrieb, braucht er einen wichtigen Grund und muss ihn angeben (§ 22 BBiG). Der Azubi kann mit 4 Wochen Frist kündigen, wenn er die Ausbildung aufgibt oder den Beruf wechselt."},{"q":"Wie wird man Mitglied einer Gewerkschaft?","a":["Durch Gesetz und Verordnung","Durch Beitritt zur Berufsgenossenschaft","Durch Anordnung des Arbeitgebers","Durch eine freiwillige Willenserklärung","Durch Abschluss eines Arbeitsvertrages"],"c":3,"n":"","e":"Die Mitgliedschaft in einer Gewerkschaft ist freiwillig (Koalitionsfreiheit, Art. 9 GG). Man tritt durch einen Antrag bei."},{"q":"Welche Aussage zur gesetzlichen Krankenversicherung ist richtig?","a":["Die Beitragshöhe richtet sich nach dem Durchschnittsverdienst aller Arbeiter eines Betriebes","Die Beiträge werden zu 75 % vom Arbeitgeber und zu 25 % vom Arbeitnehmer bezahlt","Wer ein Einkommen hat, das oberhalb der Pflichtversicherungsgrenze bzw. Beitragsbemessungsgrenze liegt, kann freiwillig in der gesetzlichen Krankenversicherung bleiben","Arbeitnehmer, die das 63. Lebensjahr vollendet haben, sind von der Beitragszahlung befreit","Jeder Arbeitnehmer im Bäckerhandwerk muss sich bei der AOK versichern"],"c":2,"n":"Korrigiert: In der Original-App war „ab 63 von der Beitragszahlung befreit“ als richtig hinterlegt. Das stimmt nicht, auch ältere Arbeitnehmer zahlen Beiträge.","e":"Wer mehr als die Versicherungspflichtgrenze verdient, ist nicht mehr pflichtversichert. Er kann dann freiwillig gesetzlich versichert bleiben oder in die private Krankenversicherung wechseln."},{"q":"Welche Institution schützt den Verbraucher vor unlauterem Wettbewerb?","a":["Deutsche Bundesbank","Bundeskartellamt","Monopolbehörde","Treuhandgesellschaft","Die Bundesregierung"],"c":1,"n":"","e":"Das Bundeskartellamt schützt den Wettbewerb und damit auch die Verbraucher, etwa vor Preisabsprachen. Gegen unlautere Werbung gehen vor allem Verbraucherzentralen und Wettbewerbsverbände vor."},{"q":"Unter welchen Umständen kann ein Betrieb einer Auszubildenden während der Lehrzeit kündigen?","a":["Wenn diese regelmäßig zu spät zur Arbeit kommt","Wenn diese in der letzten Zeit öfter krank gewesen ist","Wenn diese öfter ihre Meinung sagt","Wenn die Auszubildende schwanger wird","Wenn der Ausbilder eine neue Auszubildende findet, die schneller und gründlicher arbeitet"],"c":0,"n":"","e":"Nach der Probezeit kann der Betrieb nur aus wichtigem Grund kündigen. Ständiges Zuspätkommen trotz Abmahnung kann ein solcher Grund sein, Krankheit, Schwangerschaft oder die eigene Meinung nicht."},{"q":"Welcher Punkt darf nicht im Ausbildungsvertrag festgehalten werden?","a":["Beginn der Ausbildung","Dauer der Ausbildung","Höhe des Lohnes","Dauer des Urlaubes","Kündigung bei eventueller Heirat"],"c":4,"n":"","e":"Regelungen, die den Azubi unangemessen benachteiligen oder in sein Privatleben eingreifen, sind nichtig (§ 12 BBiG). Eine Heirat ist niemals ein Kündigungsgrund."},{"q":"Welche Folgen hat die Rationalisierung in einem Betrieb?","a":["Schaffung von Arbeitsplätzen","Erreichen von Lohnerhöhungen","Senkung des Gewinns","Steigerung der Produktivität","Einschränkung der Konkurrenzfähigkeit des eigenen Betriebes"],"c":3,"n":"","e":"Durch Rationalisierung wird mit gleichem Aufwand mehr hergestellt. Das bedeutet höhere Produktivität, manchmal aber auch weniger Arbeitsplätze."},{"q":"Hauptziel eines jeden Privatbetriebes ist,","a":["Gewinne zu erzielen","Die Regierung zufrieden zu stellen","Die Kunden zufrieden zu stellen","Das Bruttosozialprodukt zu steigern","Den Umsatz zu steigern"],"c":0,"n":"","e":"Ein privater Betrieb muss Gewinn erzielen, um zu überleben und investieren zu können. Kundenzufriedenheit und Umsatz sind Mittel zu diesem Ziel."},{"q":"Das Jugendarbeitsschutzgesetz enthält Bestimmungen über","a":["Die Arbeitszeit des Jugendlichen","Die Höhe der Urlaubsvergütung","Das Urlaubsgeld","Die Pflichten des Auszubildenden","Die Fertigkeiten, die während der Ausbildung zu vermitteln sind"],"c":0,"n":"","e":"Das Jugendarbeitsschutzgesetz regelt unter anderem die Arbeitszeit von Jugendlichen: höchstens 8 Stunden am Tag und 40 in der Woche, keine Nachtarbeit, mehr Pausen und mehr Urlaub."},{"q":"GmbH ist die Abkürzung für","a":["Genossenschaft mit beschränkter Haftung","Genossenschaft mit unbeschränkter Haftung","Gesellschaft des bürgerlichen Rechts","Gesellschaft mit besonderer Haftung","Gesellschaft mit beschränkter Haftung"],"c":4,"n":"","e":"GmbH steht für Gesellschaft mit beschränkter Haftung."},{"q":"Welche Arbeitnehmergruppe genießt keinen Kündigungsschutz?","a":["Ein 60-jähriger Betriebsrat","Ein Lehrling im 2. Ausbildungsjahr","Ein Lehrling in der Probezeit","Eine Schwangere","Ein Schwerbehinderter"],"c":2,"n":"","e":"In der Probezeit kann ein Ausbildungsverhältnis jederzeit ohne Frist und ohne Grund gekündigt werden. Es gibt also keinen Kündigungsschutz."},{"q":"Ab welchem Alter sind Mann und Frau in der Regel ehemündig?","a":["Der Mann mit 18 Jahren, die Frau mit 16 Jahren","Der Mann mit 21 Jahren, die Frau mit 18 Jahren","Beide mit 16 Jahren","Beide mit 16 Jahren, wenn die Eltern der Heirat zustimmen","Beide mit 18 Jahren"],"c":4,"n":"","e":"Seit 2017 dürfen Mann und Frau in Deutschland erst mit 18 Jahren heiraten."},{"q":"Welches Gesetz dient dem Arbeitsschutz?","a":["Jugendarbeitsschutzgesetz","Berufsbildungsgesetz","Grundgesetz","Lebensmittelkennzeichnungsverordnung","Handwerksordnung"],"c":0,"n":"","e":"Gemeint ist das Jugendarbeitsschutzgesetz: Es schützt Beschäftigte unter 18 bei der Arbeit. Das Jugendschutzgesetz regelt dagegen Alkohol, Rauchen und Ausgehzeiten in der Öffentlichkeit."},{"q":"Welche Unternehmung werden in der Regel als Einzelunternehmen geführt?","a":["Handwerksunternehmen","Unternehmen der öffentlichen Hand","Unternehmen der Fahrzeug und Maschinenbaus","Unternehmen der Nahrungsmittelindustrie","Aktiengesellschaften"],"c":0,"n":"","e":"Viele Handwerksbetriebe sind klein und gehören einem Meister allein. Sie werden deshalb meist als Einzelunternehmen geführt."},{"q":"Für welche Unternehmen ist die Rechtsform der Einzelunternehmung besonders geeignet?","a":["Unternehmen mit einem großen Kapitalaufwand","Unternehmen der öffentlichen Hand","Unternehmen mit Betrieben in vielen Ländern der Erde","Unternehmen im Bank- und Versicherungsbereich","Kleinunternehmen"],"c":4,"n":"","e":"Für kleine Unternehmen ist die Einzelunternehmung ideal: einfach zu gründen, kein Mindestkapital und keine Abstimmung mit Partnern nötig."},{"q":"Welchen Vorteil hat die Rechtsform der Einzelunternehmung für den Inhaber eines kleinen Industriebetriebes?","a":["Er bekommt in wirtschaftlich schlechten Zeiten schneller Subventionen als eine Kapitalgesellschaft","Er haftet für Verbindlichkeiten nur mit dem Geschäftsvermögen","Er braucht keine Beiträge an die Handwerkskammer zu zahlen","Er kann schnell entscheiden, ohne sich mit anderen Kapitalgebern absprechen zu müssen","Er trägt ein geringeres Risiko Konkurs anzumelden müssen als eine Kapitalgesellschaft"],"c":3,"n":"","e":"Der Einzelunternehmer entscheidet allein und schnell und behält den ganzen Gewinn. Dafür haftet er aber mit seinem gesamten Privatvermögen."},{"q":"Bei welcher der genannten Firmen handelt es sich um eine Einzelunternehmung?","a":["W. Schulz GmbH","West eG","Informationstechnik Hans Müller","Bau AG","Informationstechnik Groll GdbR"],"c":2,"n":"","e":"Ein Einzelunternehmen hat keinen Rechtsformzusatz wie GmbH, AG, eG oder GbR, sondern trägt meist den Namen des Inhabers. Eingetragene Kaufleute führen den Zusatz „e. K.“."},{"q":"Welche Unternehmensform zählt zu den Personengesellschaften?","a":["Gesellschaft mit beschränkter Haftung","Kommanditgesellschaft","Aktiengesellschaft","Genossenschaft","Kommanditgesellschaft auf Aktien"],"c":1,"n":"","e":"Personengesellschaften sind die GbR, die OHG und die KG. GmbH, AG und KGaA sind Kapitalgesellschaften, die Genossenschaft ist eine eigene Form."},{"q":"Bei welcher Unternehmensform haftet jeder Gesellschafter sowohl mit seinem Gesellschaftsanteil als auch mit seinem Privatvermögen?","a":["Offene Handelsgesellschaft","Aktiengesellschaft","Kommanditgesellschaft","Gesellschaft mit beschränkter Haftung","Genossenschaft"],"c":0,"n":"","e":"In der OHG haften alle Gesellschafter unbeschränkt, auch mit ihrem Privatvermögen, und jeder für alle Schulden der Gesellschaft."},{"q":"Welche Aussage über die offene Handelsgesellschaft ist falsch?","a":["Die OHG muss mindestens zwei Gesellschafter haben","Alle Gesellschafter haften sowohl mit ihren Gesellschaftsanteil als auch mit ihren Privatvermögen","Jeder Gesellschafter haftet nur für die von ihm selbst verursachten Schulden","Die OHG verlangt großes gegenseitiges Vertrauen und sinnvolle Zusammenarbeit de Gesellschafter","Die OHG ist eine Personengesellschaft"],"c":2,"n":"","e":"Falsch, weil in der OHG jeder Gesellschafter für alle Schulden der Gesellschaft haftet, nicht nur für die eigenen. Gläubiger können sich an jeden einzelnen halten."},{"q":"Für welche Unternehmensform gilt der Grundsatz „Gleiche Rechte, gleiche Pflichten“?","a":["Offene Handelsgesellschaft","Aktiengesellschaft","Kommanditgesellschaft","Gesellschaft mit beschränkter Haftung","Einzelunternehmung"],"c":0,"n":"","e":"In der OHG haben alle Gesellschafter grundsätzlich dieselben Rechte (z. B. Geschäftsführung) und Pflichten (volle Haftung)."},{"q":"Was bedeutet die Abkürzung KG in einem Firmenschild?","a":["Kommanditgesellschaft","Kreisgenossenschaft","Komplementärgesellschaft","Kleingesellschaft","Kleingewerbebetrieb"],"c":0,"n":"","e":"KG ist die Abkürzung für Kommanditgesellschaft."},{"q":"Um welche Unternehmensform handelt es sich wenn das Geschäftskapital von Voll- und Teilhaftern aufgebracht wird?","a":["Offene Handelsgesellschaft","Aktiengesellschaft","Kommanditgesellschaft","Gesellschaft mit beschränkter Haftung","Genossenschaft"],"c":2,"n":"","e":"In der KG gibt es Vollhafter (Komplementäre) und Teilhafter (Kommanditisten), die beide Kapital einbringen."},{"q":"In welcher Unternehmensform gibt es einen Komplementär?","a":["Einzelunternehmung","Offene Handelsgesellschaft","Kommanditgesellschaft","Gesellschaft mit beschränkter Haftung","Gesellschaft des bürgerlichen Rechts"],"c":2,"n":"","e":"Komplementär heißt der voll haftende Gesellschafter einer KG (oder KGaA)."},{"q":"Wie wird bei einer Kommanditgesellschaft die Person bezeichnet die sowohl mit ihrem Geschäfts- und Privatvermögen haftet?","a":["Kommanditgesellschafter","Aktionär","Einzelunternehmer","Komplementär","Kommanditist"],"c":3,"n":"","e":"Der Komplementär haftet unbeschränkt mit Geschäfts- und Privatvermögen. Der Kommanditist haftet nur mit seiner Einlage."},{"q":"Welche Aussage über die Rechte und Pflichten des Komplementärs bei einer Kommanditgesellschaft ist falsch?","a":["Er haftet mit seinem Gesellschafts- und Privatvermögen","Er vertritt die Gesellschaft nach außen","Er führt die Geschäfte der Gesellschaft","Er erhält den gesamten Gewinn der Gesellschaft","Sein Familienname muss in der Bezeichnung der Unternehmung enthalten sein, z.B. Schulz KG"],"c":3,"n":"","e":"Falsch, weil der Gewinn der KG auf alle Gesellschafter verteilt wird, also auch auf die Kommanditisten. Der Komplementär bekommt nicht alles."},{"q":"Wie ist die Haftung bei der Kommanditgesellschaft geregelt?","a":["Der Kommanditist ist Vollhafter, der Komplementär ist Teilhafter","Der Komplementär ist Vollhafter, der Kommanditist ist Teilhafter","Der Komplementär ist Vollhafter, der Kommanditist haftet nicht","Der Kommanditist und der Komplementär sind Teilhafter","Der Kommanditist und der Komplementär sind Vollhafter"],"c":1,"n":"","e":"In der KG haftet der Komplementär voll, auch privat. Der Kommanditist haftet nur bis zur Höhe seiner Einlage."},{"q":"Bei welcher Stelle ist der Berufsausbildungsvertrag zur Eintragung einzureichen?","a":["Bei der Berufsschule","Beim Gewerbeaufsichtsamt","Bei der Berufsgenossenschaft","Bei der zuständigen Handwerkskammer","Beim Arbeitsamt, Abteilung „Berufsberatung“"],"c":3,"n":"","e":"Der Ausbildungsbetrieb muss den Vertrag bei der zuständigen Stelle eintragen lassen, im Handwerk ist das die Handwerkskammer (Lehrlingsrolle)."}];

const content=s=>[...new Set(words(s).map(w=>NUMW[w]!==undefined&&!['ein','eine'].includes(w)?String(NUMW[w]):w).filter(w=>(/^\d+$/.test(w)||w.length>=2)&&!STOPW.has(w)&&!FILL.has(w)))];
function curTexts(){if(!run||run.done)return[];const q=Q[run.list[run.pos]];return[...app.querySelectorAll('.a')].map(b=>q.a[+b.dataset.j])}
const tri=w=>{const s='  '+w+' ',o=new Set();for(let i=0;i<s.length-2;i++)o.add(s.slice(i,i+3));return o};
// exakt = 1; nur ähnlich zählt deutlich weniger (Rentenversicherung ≠ Krankenversicherung); Zahlen nur exakt
function sim(a,b){if(a===b)return 1;if(/^\d+$/.test(a)||/^\d+$/.test(b))return 0;
  if(a.length>=5&&b.length>=5&&(a.startsWith(b)||b.startsWith(a)))return .85;
  const x=tri(a),y=tri(b);let n=0;for(const g of x)if(y.has(g))n++;const d=2*n/(x.size+y.size);return d>=.6?d*d:0}
// Wie gut passt das Gesagte zu einer Antwort? (0–1)
// Mischung aus „wie viel der Antwort wurde gesagt“ und „wie viel des Gesagten steht in der Antwort“
function contentScore(said,opt){const ow=content(opt);if(!ow.length||!said.length)return 0;
  const best=(w,list)=>{let m=0;for(const s of list){const v=sim(w,s);if(v>m)m=v}return m};
  const rec=Math.min(1,ow.reduce((n,w)=>n+best(w,said),0)/Math.min(ow.length,3));
  const pre=said.reduce((n,s)=>n+best(s,ow),0)/said.length;
  return rec+pre?2*rec*pre/(rec+pre):0}
// Buchstabe nur, wenn er eindeutig als Buchstabe gemeint ist (kurz gesagt oder nach „Antwort“)
const ART=new Set(['die','der','das','den','dem']);
function letterIn(text){const w=words(text),r=w.filter(x=>!FILL.has(x)),bare=r.filter(x=>!ART.has(x));
  const any=n=>{for(const L of [SURE,NUMS,LOOSE]){const i=L.findIndex(l=>l.includes(n));if(i>=0)return i}return -1};
  for(let k=0;k<w.length-1;k++)if(/^(antwort|buchstabe|buchstaben|lösung|nummer)$/.test(w[k])){const i=any(w[k+1]);if(i>=0)return i}
  // Zahlen/Ordnungszahlen nur, wenn sonst nichts gesagt wurde („die zweite“, „drei“) – „drei Personen“ ist eine Antwort
  if(bare.length===1){const i=NUMS.findIndex(l=>l.includes(bare[0]));if(i>=0)return i}
  if(r.length&&r.length<=3)for(let k=r.length-1;k>=0;k--){const i=SURE.findIndex(l=>l.includes(r[k]));if(i>=0)return i}
  if(r.length===1){const i=LOOSE.findIndex(l=>l.includes(r[0]));if(i>=0)return i}
  if(r.length===0&&w.length===1){const i=LOOSE.findIndex(l=>l.includes(w[0]));if(i>=0)return i}
  return -1}
function parse(alts,opts){
  alts=(alts||[]).map(String).filter(s=>s.trim());opts=opts||[];
  for(const s of alts){const w=words(s);if(w.length>3)continue;
    if(w.some(x=>/^(stopp?|beenden|aufhören|abbrechen)$/.test(x)))return'stop';
    if(w.some(x=>/^(wiederholen|wiederhole|nochmal|nochmals|wiederholung)$/.test(x)))return'repeat';
    if(w.some(x=>/^(weiter|nächste|überspringen)$/.test(x)))return'skip'}
  // 1) Buchstabe – zuerst in der wahrscheinlichsten Erkennung, dann in den Alternativen
  for(const s of alts){const i=letterIn(s);if(i>=0&&i<Math.max(opts.length,5))return i}
  // 2) Antwort selbst: beste Übereinstimmung über alle Erkennungs-Varianten, mit klarem Abstand zur zweitbesten
  if(!opts.length)return null;
  const sc=opts.map(o=>Math.max(...alts.map(s=>contentScore(content(s),o))));
  const order=sc.map((v,k)=>[v,k]).sort((a,b)=>b[0]-a[0]),[b1,b2]=[order[0],order[1]||[0,-1]];
  // bei nur einem gesagten Stichwort muss es eindeutig zu genau einer Antwort gehören
  const nSaid=Math.max(...alts.map(s=>content(s).length));
  if(b1[0]>=.5&&b1[0]-b2[0]>=(nSaid<=1?.35:.2))return b1[1];
  return null}
// ---- Grammatik für die Offline-Erkennung: nur diese Wörter darf sie hören (Rest = [unk]) ----
// Im Labor gemessen: Buchstaben + Lautschrift + deutsches Buchstabieralphabet; Artikel (die/der …) bewusst NICHT, sonst wird D zu „die“
const G_BASE=['a','b','c','d','e','ah','aa','be','bee','ce','zeh','ze','tse','de','dee','eh','anton','berta','caesar','dora','emil','antwort','buchstabe','stopp','stop','wiederholen','nochmal','weiter'];
const NUMWORD=Object.fromEntries(Object.entries(NUMW).filter(([w])=>!['ein','eine'].includes(w)).map(([w,n])=>[String(n),w]));
function grammarFor(opts){const s=new Set(G_BASE);
  for(const o of opts)for(let w of words(o)){if(/^\d+$/.test(w)){w=NUMWORD[w];if(!w)continue}
    if(w.length>=2&&!/\d/.test(w)&&!STOPW.has(w)&&!FILL.has(w))s.add(w)}
  return[...s,'[unk]']}
window.__skTest={parse:(a,o)=>parse(a,o),content:s=>content(s),grammar:o=>grammarFor(o)};
function setVState(s,heard){const el=document.getElementById('vst');if(!el)return;el.className='vst '+s;
  el.innerHTML=s==='listen'?'<i></i>Jetzt sprechen – Buchstabe oder Antwort':s==='wait'?'<i></i>Mikrofon startet …':s==='speak'?'<i></i>Liest vor …':
   s==='live'?'<i></i>Höre: „'+esc(heard)+'“':s==='heard'?'<i></i>Gehört: „'+esc(heard)+'“':''}
function updVBtn(){const b=document.getElementById('mic');if(b){b.classList.toggle('on',vs.on);b.setAttribute('aria-pressed',vs.on)}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function voiceAsk(){
  if(!run||run.done||!canSpeak)return;const my=++vToken;const i=run.list[run.pos],q=Q[i];
  const live=()=>my===vToken&&vs.on&&run&&!run.done;
  const btns=[...app.querySelectorAll('.a')];setVState('speak');
  // Alles sofort in die Warteschlange: keine Pausen zwischen Frage und Antworten
  const parts=[q.q,...btns.map((b,k)=>'ABCDE'[k]+'. '+q.a[+b.dataset.j])];
  let acc=0;const ps=parts.map(p=>{const pr=speak(p,acc);acc+=est(p);return pr});
  await ps[0];if(!live())return;
  for(let k=0;k<btns.length;k++){btns[k].classList.add('rd');await ps[k+1];btns[k].classList.remove('rd');if(!live())return}
  voiceListen(my,0);
}
// Zuhören: Stille/Zeitüberschreitung wird leise wiederholt; nur bei echtem Unverständnis kommt eine Rückfrage
async function voiceListen(my,tries){
  if(!canListen){setVState('');return}
  let quiet=0,miss=0,busy=0;
  while(true){
    await sleep(NA?120:250);if(my!==vToken||!vs.on||!run||run.done)return;
    setVState('wait');const r=await listen();
    if(my!==vToken||!vs.on||!run||run.done)return;
    if(r.err==='denied'){vs.on=false;vsave();updVBtn();setVState('');toast('Mikrofon nicht erlaubt');return}
    if(r.err==='busy'||r.err==='other'){if(++busy>3){setVState('');toast('Spracheingabe gestört – tippe aufs Mikrofon');return}await sleep(400);continue}
    if(r.err==='net'){setVState('');toast('Spracheingabe braucht Internet');return}
    if(r.err==='nomatch'){if(++quiet>=4){setVState('');toast('Nichts gehört – tippe aufs Mikrofon');return}continue}
    const p=parse(r.alts,curTexts()),btns=[...app.querySelectorAll('.a')];
    if(typeof p==='number'&&btns[p]){voicePick=p;setVState('heard',r.alts[0]||'');answer(+btns[p].dataset.j);return}
    if(p==='repeat'){voiceAsk();return}
    if(p==='skip'){go(1);return}
    if(p==='stop'){vs.on=false;vsave();updVBtn();stopVoice();toast('Sprachmodus aus');return}
    const heard=(r.alts&&r.alts[0])||'';
    if(++miss>=3){setVState('heard',heard);toast('Nicht verstanden – tippe aufs Mikrofon');return}
    setVState('heard',heard);await sleep(700);if(my!==vToken)return;
    setVState('speak');await speak(miss===1?'Nicht verstanden. Sag den Buchstaben, zum Beispiel Berta, oder die Antwort.':'Bitte nochmal.');if(my!==vToken)return;
  }
}
async function voiceFeedback(q,ok,last,next){
  const my=++vToken,btns=[...app.querySelectorAll('.a')],ci=btns.findIndex(b=>isRight(q,+b.dataset.j));
  setVState('speak');
  const said=voicePick>=0?'ABCDE'[voicePick]+'. ':'';voicePick=-1;
  const fbt=said+(ok?'Richtig.':'Falsch. Richtig ist '+'ABCDE'[ci]+'. '+q.a[q.c]);
  const p1=speak(fbt),p2=vs.expl?speak(q.e,est(fbt)):null;
  await p1;if(my!==vToken)return;if(p2){await p2;if(my!==vToken)return}
  setVState('');await sleep(150);if(my!==vToken||!vs.on)return;next();
}
function toggleVoice(){
  if(!canSpeak){toast('Sprachausgabe wird hier nicht unterstützt');return}
  // Sprachmodus an, aber gerade still (z. B. nach „Nichts gehört“): Antippen hört erneut zu statt auszuschalten
  const el=document.getElementById('vst');
  if(vs.on&&run&&!run.done&&canListen&&el&&!/listen|speak/.test(el.className)){voiceListen(++vToken,0);return}
  vs.on=!vs.on;vsave();updVBtn();
  if(vs.on){if(!canListen)toast('Nur Vorlesen – Spracheingabe geht hier nicht');if(run&&!run.done)voiceAsk()}
  else stopVoice();
}
// ---------- Wischen und Pfeiltasten im Quiz ----------
const inQuiz=()=>run&&document.getElementById('vst')&&!ov.classList.contains('on');
let sx=null,sy=0,t0=0,lock=null,dxl=0;
document.addEventListener('touchstart',e=>{sx=null;if(!inQuiz()||e.touches.length>1)return;const p=e.touches[0];
  if(p.clientX<18||p.clientX>innerWidth-18)return;sx=p.clientX;sy=p.clientY;t0=Date.now();lock=null;dxl=0},{passive:true});
document.addEventListener('touchmove',e=>{if(sx===null)return;const p=e.touches[0],dx=p.clientX-sx,dy=p.clientY-sy;
  if(lock===null&&(Math.abs(dx)>10||Math.abs(dy)>10))lock=Math.abs(dx)>Math.abs(dy)*1.3?'x':'y';
  if(lock==='x'){dxl=dx;app.style.transform=`translateX(${dx*.35}px)`}},{passive:true});
const endSwipe=()=>{if(sx===null)return;const dx=dxl,fast=Date.now()-t0<260;sx=null;
  if(lock!=='x')return;
  if(Math.abs(dx)>70||(fast&&Math.abs(dx)>35)){if(!swiped){swiped=true;try{localStorage.setItem('sk-swiped','1')}catch(e){}}go(dx<0?1:-1)}
  else if(app.animate){app.animate([{transform:app.style.transform},{transform:'none'}],{duration:200,easing:'ease-out'});app.style.transform=''}
  else app.style.transform=''};
document.addEventListener('touchend',endSwipe,{passive:true});document.addEventListener('touchcancel',endSwipe,{passive:true});
document.addEventListener('keydown',e=>{if(!inQuiz()||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){go(1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(-1);e.preventDefault()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});
function start(list,label){run={list,label,pos:0,exam:label==='Prüfung',ord:[],ans:[]};ask()}
// Blättern: d=+1 nächste Frage, d=-1 vorherige
function go(d){if(!run)return;const p=run.pos+d;
  if(p<0){bump(1);return}
  if(p>=run.list.length){result();return}
  run.pos=p;ask(d)}
function bump(d){if(!calm.matches&&app.animate)app.animate([{transform:'none'},{transform:`translateX(${d*22}px)`},{transform:'none'}],{duration:280,easing:'ease-out'})}
let swiped=false;try{swiped=!!localStorage.getItem('sk-swiped')}catch(e){}
function ask(dir){
  const i=run.list[run.pos],q=Q[i],order=run.ord[run.pos]||(run.ord[run.pos]=shuffle(q.a.map((t,j)=>j)));
  const prev=run.ans[run.pos];run.done=prev!==undefined;
  show(`<div class="top"><button class="ib" id="back" aria-label="Zurück">${ARR}</button><span class="cap">${run.label}</span><span class="tr2"><span class="cnt">${run.pos+1}/${run.list.length}</span>${canSpeak?`<button class="ib mic ${vs.on?'on':''}" id="mic" aria-label="Sprachmodus" aria-pressed="${vs.on}">${MIC}</button>`:''}</span></div>
  <div class="pbar">${run.list.length<=40?run.list.map((x,k)=>`<i class="${k===run.pos?'c':run.ans[k]!==undefined?'d':''}"></i>`).join(''):`<i class="d" style="flex:${run.pos}"></i><i style="flex:${run.list.length-run.pos}"></i>`}</div>
  <div class="qn">Frage ${i+1}</div><div class="q">${esc(q.q)}</div><div class="vst" id="vst"></div>
  <div class="ans">${order.map((j,k)=>`<button class="a" data-j="${j}"><span class="k">${'ABCDE'[k]}</span><span>${esc(q.a[j])}</span></button>`).join('')}</div><div id="fb"></div>
  ${swiped?'':'<p class="swh">‹ Wischen zum Blättern ›</p>'}`,dir);
  document.getElementById('back').onclick=()=>home();
  app.querySelectorAll('.a').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  const m=document.getElementById('mic');if(m)m.onclick=toggleVoice;
  setBot('');
  if(run.done)paint(prev,false);else if(vs.on)voiceAsk();
}
const isRight=(q,j)=>j===q.c||q.a[j]===q.a[q.c];
function answer(j){
  if(run.done)return;run.done=true;run.ans[run.pos]=j;stopVoice();
  const i=run.list[run.pos],q=Q[i],ok=isRight(q,j);
  const x=st[i]||{r:0,w:0,s:0};if(ok){x.r++;x.s++}else{x.w++;x.s=0}st[i]=x;save();
  if(run.exam){go(1);return}
  paint(j,true);
}
// Beantwortete Frage anzeigen (fresh=true direkt nach dem Antworten, false beim Zurückblättern)
function paint(j,fresh){
  const i=run.list[run.pos],q=Q[i],ok=isRight(q,j),last=run.pos===run.list.length-1,next=()=>go(1);
  app.querySelectorAll('.a').forEach(b=>{const k=+b.dataset.j;b.disabled=true;
    if(run.exam){b.classList.add(k===j?'pick':'dim');return}
    if(isRight(q,k)){b.classList.add('ok');b.querySelector('.k').textContent='✓'}else if(k===j){b.classList.add('bad');b.querySelector('.k').textContent='✕'}else b.classList.add('dim')});
  if(!run.exam)document.body.classList.add(ok?'mood-ok':'mood-bad');
  const ICO=ok?'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  if(!run.exam)document.getElementById('fb').innerHTML=`<div class="verdict ${ok?'ok':'bad'}" role="status">${ICO}${ok?'Richtig!':'Leider falsch'}</div><div class="note ${ok?'ok':'bad'}"><b>Erklärung</b>${ok?'':`<p class="rt">Richtig ist: ${esc(q.a[q.c])}</p>`}<p>${esc(q.e)}</p></div>`+(q.n?`<div class="note"><b>Hinweis</b>${esc(q.n)}</div>`:'');
  else document.getElementById('fb').innerHTML='<p class="swh">Deine Antwort. Die Auswertung kommt am Ende.</p>';
  setBot(`<button class="pri" id="next">${last?'Ergebnis':'Weiter'}</button>`);
  document.getElementById('next').onclick=()=>{stopVoice();next()};
  if(fresh&&vs.on&&canSpeak)voiceFeedback(q,ok,last,next);
}
const grade=p=>p>=.92?'1':p>=.81?'2':p>=.67?'3':p>=.5?'4':p>=.3?'5':'6';
const item=i=>{const q=Q[i];return`<li class="ri"><div class="qn">Frage ${i+1}</div><div>${esc(q.q)}</div><div class="aa">${esc(q.a[q.c])}</div><div class="ee">${esc(q.e)}</div>${q.n?`<div class="nn">Hinweis: ${esc(q.n)}</div>`:''}</li>`};
function result(){
  run.right=run.ans.reduce((s,j,k)=>s+(j!==undefined&&isRight(Q[run.list[k]],j)?1:0),0);
  const n=run.list.length,p=run.right/n,wrong=run.list.filter(i=>st[i]&&st[i].s===0),again=run.list.slice(),label=run.label;
  show(`<div class="top"><button class="ib" id="back" aria-label="Zurück">${ARR}</button><span class="cap">${label}</span><span></span></div>
  <div class="res">${run.exam?`<p>Note</p><div class="big dot">${grade(p)}</div>`:`<div class="big dot">${run.right}<span>/${n}</span></div>`}<p>${run.right} von ${n} richtig · ${Math.round(p*100)} %</p></div>
  ${wrong.length?`<h3>Falsch beantwortet</h3><ul class="list">${wrong.map(item).join('')}</ul>`:''}`);
  document.getElementById('back').onclick=()=>home();
  setBot(`<button class="pri" id="again">${run.exam?'Neue Prüfung':'Nochmal'}</button><button class="sec" id="h">Start</button>`);
  document.getElementById('h').onclick=()=>home();
  if(vs.on&&canSpeak){const my=++vToken;speak((run.exam?'Note '+grade(p)+'. ':'')+run.right+' von '+n+' richtig.')}
  document.getElementById('again').onclick=()=>label==='Prüfung'?start(shuffle(all()).slice(0,30),label):start(shuffle(again),label);
}
function list(){
  setBot('');
  show(`<div class="top"><button class="ib" id="back" aria-label="Zurück">${ARR}</button><span class="cap">Alle Fragen</span><span class="cnt" id="cnt"></span></div>
  <input class="search" id="s" type="search" placeholder="Suchen …"><ul class="list" id="res"></ul>`);
  document.getElementById('back').onclick=()=>home();
  const s=document.getElementById('s'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
  const draw=()=>{const t=s.value.trim().toLowerCase(),h=all().filter(i=>!t||(Q[i].q+' '+Q[i].a[Q[i].c]+' '+Q[i].e).toLowerCase().includes(t));cnt.textContent=h.length;res.innerHTML=h.map(item).join('')||'<li class="ri qn">Nichts gefunden</li>'};
  s.oninput=draw;draw();
}
// Zurück-Taste (Android): erst Einstellungen schließen, dann zur Übersicht, dann App schließen
window.goBack=()=>{if(ov.classList.contains('on')){closeSettings();return true}if(document.getElementById('learn'))return false;home();return true};
home();
}
