<style>
/* VOICE: ruhig, technisch, knapp – wie ein Nothing-Systemscreen

:root{color-scheme:light dark;--bg:light-dark(#f4f4f2,#050505);--ink:light-dark(#111,#f2f2f2);--mut:light-dark(#6b6b6b,#9a9a9a);--card:light-dark(#fff,#151515);--card2:light-dark(#ececea,#1e1e1e);--line:light-dark(#dcdcd8,#2a2a2a);--red:#d71921}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip}
.dot{font-family:Doto,"Hanken Grotesk",monospace;font-weight:900;letter-spacing:.02em}
button{font:inherit;color:inherit;transition:transform .15s}button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom))}

.dots{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.k{background:var(--ink)}.dots i.w{background:var(--red)}.dots i.s{background:var(--mut)}
.row3{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px}
.row3 b{color:var(--ink);font-family:Doto,monospace;font-weight:900;font-size:18px;margin-right:4px}.row3 .r b{color:var(--red)}
.pri{width:100%;min-height:58px;border:0;border-radius:99px;background:var(--red);color:#fff;font-weight:700;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}

.a.ok{border-color:var(--ink);background:var(--ink);color:var(--bg)}.a.ok .k{background:var(--bg);color:var(--ink)}
.a.bad{border-color:var(--red);color:var(--red)}.a.bad .k{background:var(--red);color:#fff}

.note b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--red);margin-bottom:4px}.note b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}

.res{text-align:center;margin:30px 0 10px}.res .big{font-size:clamp(90px,32vw,150px)}.res p{color:var(--mut);margin:6px 0}

.enter>*{animation:up .45s cubic-bezier(.2,.9,.2,1) both}.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(n+4){animation-delay:.12s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const seen=c.k+c.w+c.s;
  const blocks=[];for(let b=0;b*B<N;b++){const ids=all().slice(b*B,b*B+B);const n={k:0,s:0,w:0};ids.forEach(i=>{const s=status(i);if(s)n[s]++});blocks.push({b,ids,n})}
  const html=`<p class="cap">Prüfungsvorbereitung</p><h1>Sozialkunde</h1>
  <div class="hero"><p class="cap">sicher beherrscht</p><div class="big dot">${c.k}<span>/${N}</span></div>
   <div class="dots" aria-hidden="true">${blocks.map(x=>`<i class="${x.n.k===x.ids.length?'k':x.n.w?'w':x.n.k+x.n.s?'s':''}"></i>`).join('')}</div>
   <div class="row3"><span><b>${seen}</b>geübt</span><span class="r"><b>${c.w}</b>falsch</span><span><b>${N-seen}</b>offen</span></div></div>
  <button class="pri" id="learn">Weiterlernen · 20 Fragen</button>
  <div class="acts"><button class="sec" id="exam">Prüfung · 30</button><button class="sec" id="wrong" ${c.w?'':'disabled'}>Fehler · ${c.w}</button></div>
  <h3>Fragen nach Blöcken</h3>
  <ul class="list">${blocks.map(x=>`<li class="${x.b===openB?'open':''}" data-b="${x.b}"><button class="blk" data-t="${x.b}"><span class="n">${x.b+1}</span><span><b>Fragen ${x.b*B+1}–${x.b*B+x.ids.length}</b><small>${x.n.k} sicher · ${x.n.w} falsch</small><span class="tr"><i class="k" style="width:${x.n.k/x.ids.length*100}%"></i><i class="s" style="width:${x.n.s/x.ids.length*100}%"></i><i class="w" style="width:${x.n.w/x.ids.length*100}%"></i></span></span>${CHEV}</button>
   <div class="sub"><div><button class="go" data-go="${x.b}">Block ${x.b+1} üben</button>${x.ids.map(i=>`<button class="qi" data-q="${i}"><i class="${status(i)}"></i><span>${i+1}. ${esc(Q[i].q)}</span></button>`).join('')}</div></div></li>`).join('')}</ul>
  <h3>Alle Fragen</h3><ul class="list"><li><button class="blk" id="all"><span class="n">≡</span><span><b>Alle Lösungen ansehen</b><small>mit Suche</small></span>${CHEV}</button></li></ul>
  <button class="lnk" id="reset">Fortschritt zurücksetzen</button><div id="dlg"></div>
  <p class="foot2">Fortschritt wird nur in diesem Browser gespeichert. Fragen aus einer alten Prüfungs-App (ca. 2008); veraltete Fragen haben einen Hinweis.</p>`;
  if(keep){const y=scrollY;app.innerHTML=html;scrollTo(0,y)}else show(html);
  document.getElementById('learn').onclick=()=>{const pr=i=>({w:0,'':1,s:2,k:3})[status(i)];start(shuffle(all()).sort((a,b)=>pr(a)-pr(b)).slice(0,20),'Lernen')};
  document.getElementById('exam').onclick=()=>start(shuffle(all()).slice(0,30),'Prüfung');
  document.getElementById('wrong').onclick=()=>start(shuffle(all().filter(i=>status(i)==='w')),'Fehler');
  document.getElementById('all').onclick=()=>list();
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const li=b.parentElement,o=li.classList.toggle('open');app.querySelectorAll('.list>li.open').forEach(x=>x!==li&&x.classList.remove('open'));openB=o?+li.dataset.b:-1});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const x=blocks[+b.dataset.go];start(shuffle(x.ids),'Block '+(x.b+1))});
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>start([+b.dataset.q],'Einzelfrage'));
  document.getElementById('reset').onclick=()=>{document.getElementById('dlg').innerHTML=`<div class="dlg">Gesamten Fortschritt löschen?<div class="in"><button class="pri" id="yes">Löschen</button><button class="sec" id="no">Abbrechen</button></div></div>`;
   document.getElementById('yes').onclick=()=>{st={};save();openB=-1;home()};document.getElementById('no').onclick=()=>document.getElementById('dlg').innerHTML=''};
}
function start(list,label){run={list,label,pos:0,right:0,exam:label==='Prüfung'};ask()}
function ask(){
  const i=run.list[run.pos],q=Q[i],order=shuffle(q.a.map((t,j)=>j));run.done=false;
  show(`<div class="top"><button class="ib" id="back" aria-label="Zurück">${ARR}</button><span class="cap">${run.label}</span><span class="cnt">${run.pos+1}/${run.list.length}</span></div>
  <div class="pbar">${run.list.length<=40?run.list.map((x,k)=>`<i class="${k<run.pos?'d':k===run.pos?'c':''}"></i>`).join(''):`<i class="d" style="flex:${run.pos}"></i><i style="flex:${run.list.length-run.pos}"></i>`}</div>
  <div class="qn">Frage ${i+1}</div><div class="q">${esc(q.q)}</div>
  <div class="ans">${order.map((j,k)=>`<button class="a" data-j="${j}"><span class="k">${'ABCDE'[k]}</span><span>${esc(q.a[j])}</span></button>`).join('')}</div><div id="fb"></div>`);
  document.getElementById('back').onclick=()=>home();
  app.querySelectorAll('.a').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  setBot('');
}
const isRight=(q,j)=>j===q.c||q.a[j]===q.a[q.c];
function answer(j){
  if(run.done)return;run.done=true;
  const i=run.list[run.pos],q=Q[i],ok=isRight(q,j);
  const x=st[i]||{r:0,w:0,s:0};if(ok){x.r++;x.s++}else{x.w++;x.s=0}st[i]=x;save();if(ok)run.right++;
  const last=run.pos===run.list.length-1,next=()=>{if(last)result();else{run.pos++;ask()}};
  if(run.exam){next();return}
  app.querySelectorAll('.a').forEach(b=>{const k=+b.dataset.j;b.disabled=true;if(isRight(q,k))b.classList.add('ok');else if(k===j)b.classList.add('bad');else b.classList.add('dim')});
  document.getElementById('fb').innerHTML=(ok?'':`<div class="note"><b>Falsch</b>Richtig ist: ${esc(q.a[q.c])}</div>`)+(q.n?`<div class="note"><b>Hinweis</b>${esc(q.n)}</div>`:'');
  setBot(`<button class="pri" id="next">${last?'Ergebnis':'Weiter'}</button>`);
  document.getElementById('next').onclick=next;
}
const grade=p=>p>=.92?'1':p>=.81?'2':p>=.67?'3':p>=.5?'4':p>=.3?'5':'6';
const item=i=>{const q=Q[i];return`<li class="ri"><div class="qn">Frage ${i+1}</div><div>${esc(q.q)}</div><div class="aa">${esc(q.a[q.c])}</div>${q.n?`<div class="nn">Hinweis: ${esc(q.n)}</div>`:''}</li>`};
function result(){
  const n=run.list.length,p=run.right/n,wrong=run.list.filter(i=>st[i]&&st[i].s===0),again=run.list.slice(),label=run.label;
  show(`<div class="top"><button class="ib" id="back" aria-label="Zurück">${ARR}</button><span class="cap">${label}</span><span></span></div>
  <div class="res">${run.exam?`<p>Note</p><div class="big dot">${grade(p)}</div>`:`<div class="big dot">${run.right}<span>/${n}</span></div>`}<p>${run.right} von ${n} richtig · ${Math.round(p*100)} %</p></div>
  ${wrong.length?`<h3>Falsch beantwortet</h3><ul class="list">${wrong.map(item).join('')}</ul>`:''}`);
  document.getElementById('back').onclick=()=>home();
  setBot(`<button class="pri" id="again">${run.exam?'Neue Prüfung':'Nochmal'}</button><button class="sec" id="h">Start</button>`);
  document.getElementById('h').onclick=()=>home();
  document.getElementById('again').onclick=()=>label==='Prüfung'?start(shuffle(all()).slice(0,30),label):start(shuffle(again),label);
}
function list(){
  setBot('');
  show(`<div class="top"><button class="ib" id="back" aria-label="Zurück">${ARR}</button><span class="cap">Alle Fragen</span><span class="cnt" id="cnt"></span></div>
  <input class="search" id="s" type="search" placeholder="Suchen …"><ul class="list" id="res"></ul>`);
  document.getElementById('back').onclick=()=>home();
  const s=document.getElementById('s'),res=document.getElementById('res'),cnt=document.getElementById('cnt');
  const draw=()=>{const t=s.value.trim().toLowerCase(),h=all().filter(i=>!t||(Q[i].q+' '+Q[i].a[Q[i].c]).toLowerCase().includes(t));cnt.textContent=h.length;res.innerHTML=h.map(item).join('')||'<li class="ri qn">Nichts gefunden</li>'};
  s.oninput=draw;draw();
}
// Android-Zurück-Taste: erst zur Übersicht, dann App schließen
window.goBack=()=>{if(document.getElementById('learn'))return false;home();return true};
home();
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
